<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Dungeon Crawler</title>
<style>
  /* R102: black background, limited entity-color palette. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #9e9e9e;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  /* FR-033: compact header, max 3 text lines, stats+log left, hint right. */
  #hud {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 2px 8px;
    font-size: 14px;
    line-height: 18px;
    max-height: 54px; /* 3 lines x 18px */
    overflow: hidden;
    border-bottom: 1px solid #333;
  }
  #hud-left { min-width: 0; flex: 1 1 auto; }
  #stats { color: #fff; white-space: nowrap; }
  #stats span { margin-right: 14px; }
  #hud-log {
    height: 36px; /* 2 lines */
    overflow-y: auto;
    scrollbar-width: none;
    white-space: pre;
    color: #9e9e9e;
  }
  #hud-log::-webkit-scrollbar { display: none; }
  #hint {
    flex: 0 0 auto;
    color: #9e9e9e;
    white-space: nowrap;
    align-self: flex-start;
  }
  /* FR-033/FR-034: grid fills remaining viewport, centered, scrollable
     on both axes with no visible scrollbars. */
  #viewport {
    flex: 1 1 auto;
    overflow: auto;
    scrollbar-width: none;
    outline: none;
  }
  #viewport::-webkit-scrollbar { display: none; }
  #grid {
    /* Centered when narrower than the viewport, fully scrollable when
       wider (FR-033/FR-034). */
    width: max-content;
    margin: 0 auto;
    line-height: 0;
  }
  .row { white-space: nowrap; height: 16px; }
  .cell {
    display: inline-block;
    width: 16px;
    height: 16px;
    font-size: 14px;
    line-height: 16px;
    text-align: center;
    vertical-align: top;
  }
  /* Palette (R102): walls & staircase grey, dimmed fog dark grey,
     player white, enemies light brown, items light blue. */
  .hid { color: #000; background: #000; }
  .dim { color: #4a4a4a; }
  .ter { color: #9e9e9e; }
  .st  { color: #9e9e9e; }
  .pl  { color: #ffffff; }
  .en  { color: #c89b6a; }
  .it  { color: #9bd4f5; }
  /* FR-035: full-viewport overlays, invisible when inactive. */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 16px;
  }
  .overlay.active { display: flex; }
  .overlay h1 { color: #fff; font-size: 28px; margin: 0; letter-spacing: 4px; }
  #inv-list { text-align: left; }
  .inv-slot { color: #9e9e9e; padding: 1px 0; white-space: pre; }
  .inv-slot.sel { color: #fff; }
  .overlay .dim-text { color: #4a4a4a; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="hud-left">
      <div id="stats">
        <span id="stat-hp"></span><span id="stat-atk"></span><span id="stat-def"></span><span id="stat-lvl"></span><span id="stat-floor"></span>
      </div>
      <div id="hud-log"></div>
    </div>
    <div id="hint">WASD/Arrows to move · I for inventory · Reach &gt; to descend</div>
  </div>
  <div id="viewport"><div id="grid"></div></div>
</div>

<div id="inventory" class="overlay">
  <h1>INVENTORY</h1>
  <div id="inv-equipped"></div>
  <div id="inv-list"></div>
  <div class="dim-text">Arrows: select · Enter: use/equip · Esc: close</div>
</div>

<div id="gameover" class="overlay">
  <h1>YOU DIED</h1>
  <div id="gameover-stats"></div>
  <div>Press R to restart</div>
</div>

<div id="victory" class="overlay">
  <h1>VICTORY</h1>
  <div>You conquered the dungeon.</div>
  <div id="victory-stats"></div>
  <div>Press R to restart</div>
</div>

<!--SCRIPT-->
</body>
</html>
