<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Dungeon Crawler</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  #header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
    max-height: 54px;
    line-height: 18px;
    padding: 4px 10px;
    box-sizing: border-box;
    border-bottom: 1px solid #333;
    overflow: hidden;
  }
  #header-left { flex: 1 1 auto; overflow: hidden; }
  #header-right { flex: 0 0 auto; text-align: right; color: #7ec8e3; font-size: 12px; max-width: 40%; }
  #hud-stats { font-size: 14px; color: #fff; white-space: nowrap; }
  #hud-log { font-size: 12px; color: #a9895a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grid-wrapper {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #000;
    outline: none;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #grid-wrapper::-webkit-scrollbar { display: none; width: 0; height: 0; }
  #grid { background: #000; }
  .tile { box-sizing: border-box; }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    z-index: 10;
  }
  .overlay h1 { color: #7ec8e3; }
  #inventory-list { margin: 12px 0; min-width: 320px; }
  #inventory-list div { padding: 2px 0; font-size: 14px; }
  .overlay-hint { color: #a9895a; margin-top: 12px; }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="header-left">
        <div id="hud-stats">HP 20/20 ATK 5 DEF 1 Lvl 1 Floor 1</div>
        <div id="hud-log"></div>
      </div>
      <div id="header-right">
        <div id="hud-hint">WASD/Arrows to move · I for inventory · Reach &gt; to descend</div>
      </div>
    </div>
    <div id="grid-wrapper">
      <div id="grid"></div>
    </div>
  </div>

  <div id="inventory-overlay" class="overlay">
    <h1>Inventory</h1>
    <div id="inventory-equipped"></div>
    <div id="inventory-list"></div>
    <div class="overlay-hint">Arrows to select · Enter to use/equip · Esc to close</div>
  </div>

  <div id="gameover-overlay" class="overlay">
    <h1>Game Over</h1>
    <div id="gameover-overlay-body"></div>
    <div class="overlay-hint">Press R to restart</div>
  </div>

  <div id="victory-overlay" class="overlay">
    <h1>Victory!</h1>
    <div id="victory-overlay-body"></div>
    <div class="overlay-hint">Press R to restart</div>
  </div>

<script>
/* __GAME_BUNDLE__ */
</script>
</body>
</html>
