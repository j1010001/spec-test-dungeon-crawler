<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Dungeon Crawler</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  #header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
    max-height: 54px;
    line-height: 18px;
    padding: 4px 10px;
    box-sizing: border-box;
    border-bottom: 1px solid #333;
    overflow: hidden;
  }
  #header-left { flex: 1 1 auto; overflow: hidden; }
  #header-right { flex: 0 0 auto; text-align: right; color: #7ec8e3; font-size: 12px; max-width: 40%; }
  #hud-stats { font-size: 14px; color: #fff; white-space: nowrap; }
  #hud-log { font-size: 12px; color: #a9895a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grid-wrapper {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #000;
    outline: none;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #grid-wrapper::-webkit-scrollbar { display: none; width: 0; height: 0; }
  #grid { background: #000; }
  .tile { box-sizing: border-box; }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    z-index: 10;
  }
  .overlay h1 { color: #7ec8e3; }
  #inventory-list { margin: 12px 0; min-width: 320px; }
  #inventory-list div { padding: 2px 0; font-size: 14px; }
  .overlay-hint { color: #a9895a; margin-top: 12px; }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="header-left">
        <div id="hud-stats">HP 20/20 ATK 5 DEF 1 Lvl 1 Floor 1</div>
        <div id="hud-log"></div>
      </div>
      <div id="header-right">
        <div id="hud-hint">WASD/Arrows to move · I for inventory · Reach &gt; to descend</div>
      </div>
    </div>
    <div id="grid-wrapper">
      <div id="grid"></div>
    </div>
  </div>

  <div id="inventory-overlay" class="overlay">
    <h1>Inventory</h1>
    <div id="inventory-equipped"></div>
    <div id="inventory-list"></div>
    <div class="overlay-hint">Arrows to select · Enter to use/equip · Esc to close</div>
  </div>

  <div id="gameover-overlay" class="overlay">
    <h1>Game Over</h1>
    <div id="gameover-overlay-body"></div>
    <div class="overlay-hint">Press R to restart</div>
  </div>

  <div id="victory-overlay" class="overlay">
    <h1>Victory!</h1>
    <div id="victory-overlay-body"></div>
    <div class="overlay-hint">Press R to restart</div>
  </div>

<script>
(() => {
  // src/constants.js
  var GRID_SIZE = 80;
  var SIGHT_RADIUS = 5;
  var MAX_FLOOR = 9;
  var INVENTORY_CAP = 10;
  var HUD_LOG_MAX_LINES = 50;
  var TEST_SEED = 99999;
  var TILE = Object.freeze({
    WALL: "wall",
    FLOOR: "floor",
    STAIRS: "stairs",
    FOG: "fog"
  });
  var VISIBILITY = Object.freeze({
    HIDDEN: "hidden",
    DIMMED: "dimmed",
    LIT: "lit"
  });
  var GLYPH = Object.freeze({
    PLAYER: "@",
    WALL: "#",
    FLOOR: ".",
    STAIRS: ">",
    FOG: " ",
    POTION: "!",
    WEAPON: "/",
    ARMOR: "[",
    GOBLIN: "g",
    ORC: "o",
    WRAITH: "w"
  });
  var COLOR = Object.freeze({
    WALL: "#8a8a8a",
    STAIRS: "#8a8a8a",
    FOG_DIM: "#3a3a3a",
    PLAYER: "#ffffff",
    ENEMY: "#a9895a",
    ITEM: "#7ec8e3",
    FLOOR: "#4a4a4a",
    BACKGROUND: "#000000"
  });
  var ENEMY_TYPES_BY_FLOOR = [
    { min: 1, max: 3, type: "Goblin", glyph: GLYPH.GOBLIN },
    { min: 4, max: 6, type: "Orc", glyph: GLYPH.ORC },
    { min: 7, max: 9, type: "Wraith", glyph: GLYPH.WRAITH }
  ];
  function enemyStatsForFloor(floor) {
    return {
      hp: 10 + floor * 5,
      maxHp: 10 + floor * 5,
      attack: 3 + floor * 2,
      defense: floor
    };
  }
  function enemyTypeForFloor(floor) {
    const entry = ENEMY_TYPES_BY_FLOOR.find((e) => floor >= e.min && floor <= e.max) || ENEMY_TYPES_BY_FLOOR[ENEMY_TYPES_BY_FLOOR.length - 1];
    return entry;
  }
  function computeDamage(attacker, defender) {
    return Math.max(1, attacker.attack - defender.defense);
  }

  // src/rng.js
  function mulberry32(seed) {
    let a = seed >>> 0;

    }

    int(min, max) {

  function resolveSeed(rawValue) {

  // src/dungeon.js
  function createEmptyGrid() {
    const grid = [];
    for (let y = 0; y < GRID_SIZE; y += 1) {
      grid.push(new Array(GRID_SIZE).fill(TILE.WALL));
    }
    return grid;
  }
  function carveRoom(grid, room) {
    for (let y = room.y; y < room.y + room.h; y += 1) {
      for (let x = room.x; x < room.x + room.w; x += 1) {
        grid[y][x] = TILE.FLOOR;
      }
    }
  }
  function carveCorridor(grid, x1, y1, x2, y2) {
    let x = x1;
    let y = y1;
    while (x !== x2) {
      grid[y][x] = TILE.FLOOR;
      x += x < x2 ? 1 : -1;
    }
    while (y !== y2) {
      grid[y][x] = TILE.FLOOR;
      y += y < y2 ? 1 : -1;
    }
    grid[y2][x2] = TILE.FLOOR;
  }
  function roomCenter(room) {
    return {
      x: room.x + Math.floor(room.w / 2),
      y: room.y + Math.floor(room.h / 2)
    };
  }
  function splitAndCarve(grid, region, rng, depth) {
    const MIN_LEAF = 12;
    const canSplitH = region.w >= MIN_LEAF * 2;
    const canSplitV = region.h >= MIN_LEAF * 2;
    const shouldSplit = depth < 4 && (canSplitH || canSplitV) && rng.chance(0.8);
    if (!shouldSplit || !canSplitH && !canSplitV) {
      const room = makeRoom(region, rng);
      carveRoom(grid, room);
      return { room, rooms: [room] };
    }
    const splitHorizontally = canSplitH && (!canSplitV || rng.chance(0.5));
    let regionA;
    let regionB;
    if (splitHorizontally) {
      const cut = rng.int(MIN_LEAF, region.w - MIN_LEAF);
      regionA = { x: region.x, y: region.y, w: cut, h: region.h };
      regionB = { x: region.x + cut, y: region.y, w: region.w - cut, h: region.h };
    } else {
      const cut = rng.int(MIN_LEAF, region.h - MIN_LEAF);
      regionA = { x: region.x, y: region.y, w: region.w, h: cut };
      regionB = { x: region.x, y: region.y + cut, w: region.w, h: region.h - cut };
    }
    const resultA = splitAndCarve(grid, regionA, rng, depth + 1);
    const resultB = splitAndCarve(grid, regionB, rng, depth + 1);
    const centerA = roomCenter(resultA.room);
    const centerB = roomCenter(resultB.room);
    if (rng.chance(0.5)) {
      carveCorridor(grid, centerA.x, centerA.y, centerB.x, centerB.y);
    } else {
      let y = centerA.y;
      while (y !== centerB.y) {
        grid[y][centerA.x] = TILE.FLOOR;
        y += y < centerB.y ? 1 : -1;
      }
      let x = centerA.x;
      while (x !== centerB.x) {
        grid[centerB.y][x] = TILE.FLOOR;
        x += x < centerB.x ? 1 : -1;
      }
      grid[centerB.y][centerB.x] = TILE.FLOOR;
    }

      room: rng.chance(0.5) ? resultA.room : resultB.room,
      rooms: [...resultA.rooms, ...resultB.rooms]

  }
  function makeRoom(region, rng) {
    const minSize = 5;
    const maxW = Math.max(minSize, Math.min(region.w - 2, 14));
    const maxH = Math.max(minSize, Math.min(region.h - 2, 14));
    const w = rng.int(minSize, maxW);
    const h = rng.int(minSize, maxH);
    const x = region.x + rng.int(1, Math.max(1, region.w - w - 1));
    const y = region.y + rng.int(1, Math.max(1, region.h - h - 1));
    return { x, y, w, h };
  }
  function isTileFree(grid, occupied, x, y) {
    return grid[y][x] === TILE.FLOOR && !occupied.has(`${x},${y}`);
  }
  function randomFreeTileInRoom(room, grid, occupied, rng, maxAttempts = 200) {
    for (let i = 0; i < maxAttempts; i += 1) {
      const x = rng.int(room.x, room.x + room.w - 1);
      const y = rng.int(room.y, room.y + room.h - 1);
      if (isTileFree(grid, occupied, x, y)) {
        return { x, y };
      }
    }
    return null;
  }
  function placeEnemiesForFloor(floor, rooms, startRoom, grid, occupied, rng) {
    const enemies = [];
    const { type, glyph } = enemyTypeForFloor(floor);
    for (const room of rooms) {
      if (room === startRoom) continue;
      const count = rng.int(1, 3);
      for (let i = 0; i < count; i += 1) {
        const tile = randomFreeTileInRoom(room, grid, occupied, rng);
        if (!tile) continue;
        occupied.add(`${tile.x},${tile.y}`);
        const stats = enemyStatsForFloor(floor);
        enemies.push({
          id: `enemy-${enemies.length}-${floor}`,
          x: tile.x,
          y: tile.y,
          hp: stats.hp,
          maxHp: stats.maxHp,
          attack: stats.attack,
          defense: stats.defense,
          type,
          glyph,
          activated: false,
          roomIndex: rooms.indexOf(room),
          alive: true
        });
      }
    }
    return enemies;
  }
  function randomItemType(rng) {
    return rng.pick(["potion", "weapon", "armor"]);
  }
  function placeItemsForFloor(floor, rooms, startRoom, stairsPos, grid, occupied, rng) {
    const items = [];
    const count = rng.int(1, 3);
    const candidateRooms = rooms.filter((r) => r !== startRoom);
    for (let i = 0; i < count; i += 1) {
      const room = candidateRooms.length ? rng.pick(candidateRooms) : rooms[0];
      const tile = randomFreeTileInRoom(room, grid, occupied, rng);
      if (!tile) continue;
      if (stairsPos && tile.x === stairsPos.x && tile.y === stairsPos.y) continue;
      occupied.add(`${tile.x},${tile.y}`);
      items.push(makeItem(randomItemType(rng), floor, rng, tile));
    }
    return items;
  }
  function makeItem(type, floor, rng, pos) {
    const id = `item-${type}-${Math.random().toString(36).slice(2, 9)}`;
    const base = { id, type, x: pos ? pos.x : void 0, y: pos ? pos.y : void 0 };
    if (type === "potion") {
      return { ...base, glyph: "!", value: 10 + floor * 5, label: "Health Potion" };
    }
    if (type === "weapon") {
      return { ...base, glyph: "/", value: floor + rng.int(0, 2), label: "Weapon" };
    }
    return { ...base, glyph: "[", value: floor + rng.int(0, 2), label: "Armor" };
  }
  function buildTestDungeon(floor, rng) {
    const grid = createEmptyGrid();
    const roomA = { x: 37, y: 37, w: 7, h: 7 };
    const roomB = { x: 52, y: 36, w: 9, h: 9 };
    const roomC = { x: 36, y: 52, w: 9, h: 9 };
    const roomD = { x: 38, y: 24, w: 5, h: 5 };
    carveRoom(grid, roomA);
    carveRoom(grid, roomB);
    carveRoom(grid, roomC);
    carveRoom(grid, roomD);
    for (let x = roomA.x + roomA.w; x < roomB.x; x += 1) {
      for (let y = 39; y <= 41; y += 1) grid[y][x] = TILE.FLOOR;
    }
    for (let y = roomA.y + roomA.h; y < roomC.y; y += 1) {
      for (let x = 39; x <= 41; x += 1) grid[y][x] = TILE.FLOOR;
    }
    for (let y = roomD.y + roomD.h; y < roomA.y; y += 1) {
      for (let x = 39; x <= 41; x += 1) grid[y][x] = TILE.FLOOR;
    }
    const stairsPos = { x: roomD.x + 2, y: roomD.y + 1 };
    grid[stairsPos.y][stairsPos.x] = TILE.STAIRS;
    const playerStart = roomCenter(roomA);
    const occupied = /* @__PURE__ */ new Set([`${stairsPos.x},${stairsPos.y}`]);
    const goblinStats = enemyStatsForFloor(1);
    const goblinTile = { x: roomB.x + 1, y: roomB.y + 4 };
    occupied.add(`${goblinTile.x},${goblinTile.y}`);
    const enemies = [
      {
        id: "test-goblin-b",
        x: goblinTile.x,
        y: goblinTile.y,
        hp: goblinStats.hp,
        maxHp: goblinStats.maxHp,
        attack: goblinStats.attack,
        defense: goblinStats.defense,
        type: "Goblin",
        glyph: "g",
        activated: false,
        roomIndex: 1,
        alive: true
      }
    ];
    const itemTypeSequence = [
      "potion",
      "potion",
      "potion",
      "potion",
      "weapon",
      "weapon",
      "weapon",
      "weapon",
      "armor",
      "armor",
      "armor"
    ];
    const items = [];
    let placed = 0;
    for (let yy = roomB.y; yy < roomB.y + roomB.h && placed < itemTypeSequence.length; yy += 1) {
      for (let xx = roomB.x; xx < roomB.x + roomB.w && placed < itemTypeSequence.length; xx += 1) {
        const key = `${xx},${yy}`;
        if (occupied.has(key)) continue;
        const type = itemTypeSequence[placed];
        items.push(makeItem(type, floor, rng, { x: xx, y: yy }));
        occupied.add(key);
        placed += 1;
      }
    }
    const cStats = enemyStatsForFloor(1);
    const cTiles = [
      { x: roomC.x + 1, y: roomC.y + 1 },
      { x: roomC.x + 4, y: roomC.y + 4 },
      { x: roomC.x + 7, y: roomC.y + 7 }
    ];
    cTiles.forEach((tile, i) => {
      occupied.add(`${tile.x},${tile.y}`);
      enemies.push({
        id: `test-goblin-c-${i}`,
        x: tile.x,
        y: tile.y,
        hp: cStats.hp,
        maxHp: cStats.maxHp,
        attack: cStats.attack,
        defense: cStats.defense,
        type: "Goblin",
        glyph: "g",
        activated: false,
        roomIndex: 2,
        alive: true
      });
    });
    const rooms = [roomA, roomB, roomC, roomD];
    return {
      grid,
      rooms,
      roomNames: ["A", "B", "C", "D"],
      startRoom: roomA,
      stairsRoom: roomD,
      stairsPos,
      playerStart,
      enemies,
      items

  }
  function generateFloor(floor, seed) {
    const rng = new Rng((seed ^ floor * 2654435761) >>> 0);

      return buildTestDungeon(floor, rng);
    }
    return generateProceduralFloor(floor, rng);
  }
  function generateProceduralFloor(floor, rng) {
    const grid = createEmptyGrid();
    const region = { x: 1, y: 1, w: GRID_SIZE - 2, h: GRID_SIZE - 2 };
    const { rooms } = splitAndCarve(grid, region, rng, 0);
    const startRoom = rng.pick(rooms);
    let stairsRoom = rng.pick(rooms);
    let guard = 0;
    while (stairsRoom === startRoom && rooms.length > 1 && guard < 50) {
      stairsRoom = rng.pick(rooms);
      guard += 1;
    }
    const stairsPos = roomCenter(stairsRoom);
    grid[stairsPos.y][stairsPos.x] = TILE.STAIRS;
    const playerStart = roomCenter(startRoom);
    const occupied = /* @__PURE__ */ new Set([`${stairsPos.x},${stairsPos.y}`]);
    const enemies = placeEnemiesForFloor(floor, rooms, startRoom, grid, occupied, rng);
    const items = placeItemsForFloor(floor, rooms, startRoom, stairsPos, grid, occupied, rng);
    return { grid, rooms, startRoom, stairsRoom, stairsPos, playerStart, enemies, items };
  }

  // src/entities.js
  function createPlayer() {
    return {
      x: 0,
      y: 0,
      hp: 20,
      maxHp: 20,
      baseAttack: 5,
      baseDefense: 1,
      equippedWeapon: null,
      equippedArmor: null,
      floor: 1,
      inventory: [],

  }
  function playerAttack(player) {
    return player.baseAttack + (player.equippedWeapon ? player.equippedWeapon.value : 0);
  }
  function playerDefense(player) {
    return player.baseDefense + (player.equippedArmor ? player.equippedArmor.value : 0);
  }
  function addToInventory(player, item) {
    if (player.inventory.length >= INVENTORY_CAP) {

    const { x, y, ...carried } = item;
    player.inventory.push(carried);
    return true;
  }
  function useInventoryItem(player, index) {
    const item = player.inventory[index];
    if (!item) {
      return { ok: false, message: "No item in that slot." };
    }
    if (item.type === "potion") {
      const before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + item.value);
      player.inventory.splice(index, 1);
      const healed = player.hp - before;
      return { ok: true, message: `Used ${item.label}. Restored ${healed} HP.` };
    }
    if (item.type === "weapon") {
      const previous = player.equippedWeapon;
      player.equippedWeapon = item;
      if (previous) {
        player.inventory.splice(index, 1, previous);
      } else {
        player.inventory.splice(index, 1);
      }
      return { ok: true, message: `Equipped ${item.label} (+${item.value} ATK).` };
    }
    if (item.type === "armor") {
      const previous = player.equippedArmor;
      player.equippedArmor = item;
      if (previous) {
        player.inventory.splice(index, 1, previous);
      } else {
        player.inventory.splice(index, 1);
      }
      return { ok: true, message: `Equipped ${item.label} (+${item.value} DEF).` };

  // src/combat.js
  function playerAttackEnemy(player, enemy) {
    const attacker = { attack: playerAttack(player) };
    const damage = computeDamage(attacker, enemy);
    enemy.hp = Math.max(0, enemy.hp - damage);
    const enemyDied = enemy.hp === 0;
    if (enemyDied) {
      enemy.alive = false;
    }
    return {
      damage,
      enemyDied,
      message: `You hit ${enemy.type} for ${damage}.${enemyDied ? ` ${enemy.type} dies!` : ""}`

  }
  function enemyAttackPlayer(player, enemy) {
    const defender = { defense: playerDefense(player) };
    const damage = computeDamage(enemy, defender);
    player.hp = Math.max(0, player.hp - damage);
    const playerDied = player.hp === 0;
    return {
      damage,
      playerDied,
      message: `${enemy.type} hits you for ${damage}.`

  }
  function rollEnemyDrop(rng) {

  // src/logger.js
  var LEVELS = ["info", "warn", "error"];

  // src/game.js
