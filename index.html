<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Dungeon Crawler</title>
<style>
/* Retro Dungeon Crawler — R102 limited palette on black, FR-033 layout.   */
/* Colors: walls/staircase/terrain grey #9e9e9e, fog (dimmed) dark grey    */
/* #4d4d4d, player white #ffffff, enemies light brown #c49a6c, items light */
/* blue #8fd0ff, background black. No other foreground colors.             */

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000000;
  color: #9e9e9e;
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Header: compact, max 3 text lines (FR-033). Stats+log left, hint right. */
#hud {
  display: flex;
  flex: 0 0 auto;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1em;
  line-height: 1.2em;
  max-height: 3.6em; /* 3 lines */
  overflow: hidden;
  padding: 0 0.5em;
  font-size: 14px;
}

#hud-left {
  flex: 1 1 auto;
  min-width: 0;
}

#stats {
  color: #ffffff;
  white-space: nowrap;
  height: 1.2em;
  overflow: hidden;
}

/* FR-018: 50-line rolling buffer retained; only the newest lines that fit
   the header are shown; older lines reachable by scrolling (no scrollbar). */
#log {
  height: 2.4em; /* 2 lines — header total stays ≤ 3 lines */
  overflow-y: auto;
  scrollbar-width: none;
  color: #9e9e9e;
}
#log::-webkit-scrollbar {
  display: none;
}
#log div {
  white-space: nowrap;
  height: 1.2em;
}

#hint {
  flex: 0 0 auto;
  color: #ffffff;
  white-space: nowrap;
}
#hint[hidden] {
  display: none;
}

/* Grid viewport: fills remaining space, scrollable both axes, scrollbars
   hidden (FR-033/FR-034), horizontally centered, focusable (FR-030). */
#viewport {
  flex: 1 1 auto;
  overflow: auto;
  scrollbar-width: none;
  outline: none;
  display: block;
  text-align: center;
}
#viewport::-webkit-scrollbar {
  display: none;
}
#viewport:focus {
  box-shadow: inset 0 0 0 1px #4d4d4d; /* visible focus feedback (FR-030) */
}

/* 2D character grid: rows of fixed-size cells (FR-001/FR-015). */
#grid {
  display: inline-block;
  text-align: left;
}
.row {
  height: 16px;
  line-height: 16px;
  white-space: nowrap;
}
.t {
  display: inline-block;
  width: 12px;
  height: 16px;
  font-size: 14px;
  text-align: center;
  vertical-align: top;
  background: #000000;
}

/* Visibility + entity colors (R102). Hidden tiles are black squares. */
.t.hid {
  color: #000000;
}
.t.dim {
  color: #4d4d4d;
}
.t.terrain {
  color: #9e9e9e;
}
.t.player {
  color: #ffffff;
}
.t.enemy {
  color: #c49a6c;
}
.t.item {
  color: #8fd0ff;
}

/* Full-viewport overlays (FR-035): cover everything when active, fully
   invisible when inactive. */
.overlay {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 16px;
}
.overlay[hidden] {
  display: none;
}
.overlay .panel {
  text-align: left;
  min-width: 24em;
}
.overlay h2 {
  color: #ffffff;
  text-align: center;
}
.overlay .slot {
  white-space: pre;
  color: #9e9e9e;
}
.overlay .slot.selected {
  color: #ffffff;
}
.overlay .empty {
  color: #4d4d4d;
}
.overlay .equipped,
.overlay .help {
  color: #9e9e9e;
  margin: 0.6em 0;
}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
// ===== src/constants.js =====
// Shared constants: grid dimensions, sight radius, glyphs, palette (R102),
// enemy type table (FR-006) and stat/item formulas (Key Entities).

const GRID_W = 80;
const GRID_H = 80;
const SIGHT_RADIUS = 5; // R100 — Chebyshev
const MAX_INVENTORY = 10; // FR-009
const LOG_LINES = 50; // FR-018 rolling buffer
const MAX_FLOOR = 9; // R101 — stairs on floor 9 => victory, no floor 10
const TEST_SEED = 99999; // FR-039

// Tile types
const TILE = {
  WALL: 0,
  FLOOR: 1,
  STAIRS: 2,
};

// Visibility states (FR-003 / R100)
const VIS = {
  HIDDEN: 0,
  DIM: 1,
  LIT: 2,
};

const GLYPHS = {
  player: '@',
  wall: '#',
  floor: '.',
  stairs: '>',
  goblin: 'g',
  orc: 'o',
  wraith: 'w',
  potion: '!',
  weapon: '/',
  armor: ']',
};

// R102 limited palette — black background; walls+staircase grey, fog (dimmed)
// dark grey, player white, enemies light brown, items light blue. No other
// foreground colors are permitted.
const COLORS = {
  background: '#000000',
  grey: '#9e9e9e', // walls, staircase, lit terrain
  darkGrey: '#4d4d4d', // dimmed (fog-of-war) terrain
  white: '#ffffff', // player
  lightBrown: '#c49a6c', // enemies
  lightBlue: '#8fd0ff', // items
};

// Enemy type by floor range (FR-006)
function enemyTypeForFloor(floor) {
  if (floor <= 3) return { type: 'Goblin', glyph: GLYPHS.goblin };
  if (floor <= 6) return { type: 'Orc', glyph: GLYPHS.orc };
  return { type: 'Wraith', glyph: GLYPHS.wraith };
}

// Enemy stat formulas (Key Entities): HP = 10 + floor*5, atk = 3 + floor*2, def = floor
function enemyStatsForFloor(floor) {
  return {
    hp: 10 + floor * 5,
    attack: 3 + floor * 2,
    defense: floor,
  };
}

// Combat damage (FR-021): max(1, attacker.attack - defender.defense)
function damage(attack, defense) {
  return Math.max(1, attack - defense);
}

// Item effect formulas (Key Entities). `rand02` is an integer in 0..2 supplied
// by the seeded RNG (weapon/armor bonus = floor + random(0..2)).
function potionValue(floor) {
  return 10 + floor * 5;
}
function weaponValue(floor, rand02) {
  return floor + rand02;
}
function armorValue(floor, rand02) {
  return floor + rand02;
}

// Chebyshev distance — the metric for adjacency, fog-of-war and movement
// (clarification 2026-06-26: 8-directional everything).
function chebyshev(x1, y1, x2, y2) {
  return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2));
}


// ===== src/rng.js =====
// Seeded RNG (mulberry32) + seed parsing per FR-038.
// All randomness in a run flows through one Rng instance, making runs fully
// reproducible given the same seed.

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Rng {
  constructor(seed) {
    this.seed = seed;
    this._next = mulberry32(seed);
  }

  // float in [0, 1)
  next() {
    return this._next();
  }

  // integer in [min, max] inclusive
  int(min, max) {
    return min + Math.floor(this.next() * (max - min + 1));
  }

  // pick a random element of a non-empty array
  pick(arr) {
    return arr[this.int(0, arr.length - 1)];
  }

  // true with probability p (0..1)
  chance(p) {
    return this.next() < p;
  }
}

// FR-038: parse `?seed=N`. Returns an integer seed, or null when the
// parameter is absent or does not parse to an integer (NaN => auto-seed
// fallback, no error shown).
function parseSeedParam(search) {
  if (!search) return null;
  const q = search.startsWith('?') ? search.slice(1) : search;
  for (const pair of q.split('&')) {
    const [k, v] = pair.split('=');
    if (k === 'seed') {
      const n = parseInt(decodeURIComponent(v ?? ''), 10);
      return Number.isNaN(n) ? null : n;
    }
  }
  return null;
}


// ===== src/logger.js =====
// FR-037: structured developer-facing log events, emitted via the console
// (DevTools-only, invisible to players). Each event carries a timestamp,
// level, component name and message. Distinct from the player-facing HUD
// combat log (FR-018).

let sink = null; // test hook: capture events instead of console

function setLogSink(fn) {
  sink = fn;
}

function logEvent(level, component, message, data) {
  const event = {
    timestamp: new Date().toISOString(),
    level,
    component,
    message,
  };
  if (data !== undefined) event.data = data;
  if (sink) {
    sink(event);
    return event;
  }
  /* eslint-disable no-console */
  if (typeof console !== 'undefined') {
    const line = `[${event.timestamp}] [${level}] [${component}] ${message}`;
    if (level === 'error') console.error(line, data ?? '');
    else if (level === 'warn') console.warn(line, data ?? '');
    else console.info(line, data ?? '');
  }
  return event;
}


// ===== src/fov.js =====
// Fog-of-war (FR-002, FR-003, R100): pure Chebyshev radius-5 sight.
// Visibility per tile: LIT within radius, DIM if previously visited but out
// of radius, HIDDEN if never visited. Visited state is per-floor and resets
// on descent (FR-003).


function makeVisited() {
  return new Uint8Array(GRID_W * GRID_H);
}

// Marks tiles within the sight radius of (px, py) as visited.
function markVisible(visited, px, py) {
  const x0 = Math.max(0, px - SIGHT_RADIUS);
  const x1 = Math.min(GRID_W - 1, px + SIGHT_RADIUS);
  const y0 = Math.max(0, py - SIGHT_RADIUS);
  const y1 = Math.min(GRID_H - 1, py + SIGHT_RADIUS);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) visited[y * GRID_W + x] = 1;
  }
}

// Visibility state of tile (x, y) given player position and visited map.
function visibilityAt(visited, px, py, x, y) {
  if (chebyshev(px, py, x, y) <= SIGHT_RADIUS) return VIS.LIT;
  return visited[y * GRID_W + x] ? VIS.DIM : VIS.HIDDEN;
}

function isLit(px, py, x, y) {
  return chebyshev(px, py, x, y) <= SIGHT_RADIUS;
}


// ===== src/dungeon.js =====
// Floor generation: BSP partitioning with rectangular rooms and connecting
// corridors (FR-013, FR-017, FR-020, FR-024, FR-025, FR-006), plus the
// deterministic seed-99999 test dungeon for floor 1 (FR-039 / US5).


// ---------------------------------------------------------------- items ----

function makeItem(kind, floor, rng) {
  if (kind === 'potion') {
    const v = potionValue(floor);
    return { kind: 'potion', value: v, glyph: '!', name: `Health Potion (+${v} HP)` };
  }
  if (kind === 'weapon') {
    const v = weaponValue(floor, rng.int(0, 2));
    return { kind: 'weapon', value: v, glyph: '/', name: `Weapon (+${v} ATK)` };
  }
  const v = armorValue(floor, rng.int(0, 2));
  return { kind: 'armor', value: v, glyph: ']', name: `Armor (+${v} DEF)` };
}

function randomItem(floor, rng) {
  const kind = rng.pick(['potion', 'weapon', 'armor']);
  return makeItem(kind, floor, rng);
}

function makeEnemy(floor, x, y, roomIndex, { patrols = true } = {}) {
  const t = enemyTypeForFloor(floor);
  const s = enemyStatsForFloor(floor);
  return {
    x,
    y,
    hp: s.hp,
    maxHp: s.hp,
    attack: s.attack,
    defense: s.defense,
    type: t.type,
    glyph: t.glyph,
    roomIndex, // spawning room (patrol boundary, R103)
    activated: false,
    // R103 idle patrol. FR-039 overrides it for the seed-99999 test dungeon:
    // its enemies MUST still be within sight radius of the room entrance
    // whenever the player enters, so they hold position until activated.
    patrols,
  };
}

// ------------------------------------------------------------ BSP floors ----

const MIN_LEAF = 12; // leaf side incl. margin
const ROOM_MARGIN = 2;

function splitLeaves(rng, x, y, w, h, depth, out) {
  const canSplitH = h >= MIN_LEAF * 2;
  const canSplitV = w >= MIN_LEAF * 2;
  if (depth <= 0 || (!canSplitH && !canSplitV)) {
    out.push({ x, y, w, h });
    return;
  }
  let vertical;
  if (canSplitH && canSplitV) vertical = rng.chance(w > h ? 0.7 : 0.3);
  else vertical = canSplitV;
  if (vertical) {
    const cut = rng.int(MIN_LEAF, w - MIN_LEAF);
    splitLeaves(rng, x, y, cut, h, depth - 1, out);
    splitLeaves(rng, x + cut, y, w - cut, h, depth - 1, out);
  } else {
    const cut = rng.int(MIN_LEAF, h - MIN_LEAF);
    splitLeaves(rng, x, y, w, cut, depth - 1, out);
    splitLeaves(rng, x, y + cut, w, h - cut, depth - 1, out);
  }
}

function carveRoom(tiles, room) {
  for (let yy = room.y; yy < room.y + room.h; yy++) {
    for (let xx = room.x; xx < room.x + room.w; xx++) {
      tiles[yy][xx] = TILE.FLOOR;
    }
  }
}

function carveCorridorSegment(tiles, x1, y1, x2, y2) {
  // Horizontal or vertical strip of floor tiles.
  if (x1 === x2) {
    for (let yy = Math.min(y1, y2); yy <= Math.max(y1, y2); yy++) tiles[yy][x1] = TILE.FLOOR;
  } else {
    for (let xx = Math.min(x1, x2); xx <= Math.max(x1, x2); xx++) tiles[y1][xx] = TILE.FLOOR;
  }
}

function connect(tiles, rng, roomA, roomB) {
  // L-shaped corridor between room centers (each leg a horizontal or
  // vertical strip per the Corridor entity definition).
  const ax = Math.floor(roomA.x + roomA.w / 2);
  const ay = Math.floor(roomA.y + roomA.h / 2);
  const bx = Math.floor(roomB.x + roomB.w / 2);
  const by = Math.floor(roomB.y + roomB.h / 2);
  if (rng.chance(0.5)) {
    carveCorridorSegment(tiles, ax, ay, bx, ay);
    carveCorridorSegment(tiles, bx, ay, bx, by);
  } else {
    carveCorridorSegment(tiles, ax, ay, ax, by);
    carveCorridorSegment(tiles, ax, by, bx, by);
  }
}

function emptyTiles() {
  const tiles = [];
  for (let y = 0; y < GRID_H; y++) tiles.push(new Array(GRID_W).fill(TILE.WALL));
  return tiles;
}

function roomCenter(room) {
  return { x: Math.floor(room.x + room.w / 2), y: Math.floor(room.y + room.h / 2) };
}

function tileInRoom(room, x, y) {
  return x >= room.x && x < room.x + room.w && y >= room.y && y < room.y + room.h;
}

function generateBspFloor(rng, floor) {
  const tiles = emptyTiles();
  const leaves = [];
  // Keep a 1-tile wall border around the whole grid.
  splitLeaves(rng, 1, 1, GRID_W - 2, GRID_H - 2, 4, leaves);

  const rooms = [];
  for (const leaf of leaves) {
    const maxW = leaf.w - ROOM_MARGIN * 2;
    const maxH = leaf.h - ROOM_MARGIN * 2;
    const w = rng.int(Math.min(4, maxW), Math.min(maxW, 14));
    const h = rng.int(Math.min(4, maxH), Math.min(maxH, 14));
    const x = leaf.x + rng.int(ROOM_MARGIN, leaf.w - w - ROOM_MARGIN);
    const y = leaf.y + rng.int(ROOM_MARGIN, leaf.h - h - ROOM_MARGIN);
    rooms.push({ x, y, w, h });
  }
  for (const room of rooms) carveRoom(tiles, room);
  // Connect each room to the next (chain over the leaf order) — connectivity
  // by construction, every room reachable (FR-013/FR-017).
  for (let i = 1; i < rooms.length; i++) connect(tiles, rng, rooms[i - 1], rooms[i]);

  // FR-024: starting room and staircase room are distinct random rooms.
  const startIdx = rng.int(0, rooms.length - 1);
  let stairsIdx = rng.int(0, rooms.length - 1);
  while (stairsIdx === startIdx) stairsIdx = rng.int(0, rooms.length - 1);

  const playerStart = roomCenter(rooms[startIdx]);

  // Staircase: random floor tile in the staircase room.
  const stairsRoom = rooms[stairsIdx];
  let stairsPos = roomCenter(stairsRoom);
  const candidates = [];
  for (let y = stairsRoom.y; y < stairsRoom.y + stairsRoom.h; y++) {
    for (let x = stairsRoom.x; x < stairsRoom.x + stairsRoom.w; x++) {
      if (!(x === playerStart.x && y === playerStart.y)) candidates.push({ x, y });
    }
  }
  if (candidates.length) stairsPos = rng.pick(candidates);
  tiles[stairsPos.y][stairsPos.x] = TILE.STAIRS;

  // Items: 1-3 per floor on random walkable floor tiles, at most one per
  // tile, never on the staircase or the player start (FR-025).
  const items = [];
  const itemCount = rng.int(1, 3);
  let guard = 0;
  while (items.length < itemCount && guard++ < 500) {
    const room = rng.pick(rooms);
    const x = rng.int(room.x, room.x + room.w - 1);
    const y = rng.int(room.y, room.y + room.h - 1);
    if (tiles[y][x] !== TILE.FLOOR) continue; // skips staircase
    if (x === playerStart.x && y === playerStart.y) continue;
    if (items.some((it) => it.x === x && it.y === y)) continue; // FR-025
    const item = randomItem(floor, rng);
    item.x = x;
    item.y = y;
    items.push(item);
  }

  // Enemies: 1-3 per non-starting room (FR-006); starting room always safe.
  // Tiles occupied by items or the staircase are invalid enemy spawns; a
  // room with no valid tiles simply gets fewer/zero enemies (edge case).
  const enemies = [];
  for (let r = 0; r < rooms.length; r++) {
    if (r === startIdx) continue;
    const room = rooms[r];
    const want = rng.int(1, 3);
    const free = [];
    for (let y = room.y; y < room.y + room.h; y++) {
      for (let x = room.x; x < room.x + room.w; x++) {
        if (tiles[y][x] !== TILE.FLOOR) continue;
        if (items.some((it) => it.x === x && it.y === y)) continue;
        if (x === playerStart.x && y === playerStart.y) continue;
        free.push({ x, y });
      }
    }
    for (let n = 0; n < want && free.length > 0; n++) {
      const i = rng.int(0, free.length - 1);
      const pos = free.splice(i, 1)[0];
      enemies.push(makeEnemy(floor, pos.x, pos.y, r));
    }
  }

  return {
    tiles,
    rooms,
    startRoomIndex: startIdx,
    stairsRoomIndex: stairsIdx,
    playerStart,
    stairsPos,
    items,
    enemies,
  };
}

// ------------------------------------------------- FR-039 test dungeon ----

// Fixed hub layout, floor 1, seed 99999. Four rooms around central Room A,
// each linked by its own corridor exactly 8 tiles long and 3 tiles wide.
const TEST_LAYOUT = {
  roomA: { x: 37, y: 37, w: 7, h: 7 }, // start (min 5x5)
  roomB: { x: 52, y: 36, w: 9, h: 9 }, // right — combat/items (min 7x7)
  roomC: { x: 36, y: 52, w: 9, h: 9 }, // down — death room (min 7x7)
  roomD: { x: 37, y: 22, w: 7, h: 7 }, // up — descent room (min 5x5)
  corridorRight: { x: 44, y: 39, w: 8, h: 3 },
  corridorDown: { x: 39, y: 44, w: 3, h: 8 },
  corridorUp: { x: 39, y: 29, w: 3, h: 8 },
  playerStart: { x: 40, y: 40 },
  stairs: { x: 40, y: 26 }, // within 3 tiles of Room D entrance (40,28)
  goblinB: { x: 55, y: 40 }, // within sight radius of Room B entrance (52,40)
  goblinsC: [
    { x: 38, y: 55 },
    { x: 40, y: 56 },
    { x: 42, y: 55 },
  ], // all within sight radius of Room C entrance (40,52)
  // Eleven items in Room B, each on its own tile (FR-025), mix of all three
  // types with at least one of each.
  itemsB: [
    { kind: 'potion', x: 53, y: 37 },
    { kind: 'weapon', x: 55, y: 37 },
    { kind: 'armor', x: 57, y: 37 },
    { kind: 'potion', x: 53, y: 39 },
    { kind: 'weapon', x: 57, y: 39 },
    { kind: 'potion', x: 53, y: 41 },
    { kind: 'armor', x: 57, y: 41 },
    { kind: 'potion', x: 53, y: 43 },
    { kind: 'weapon', x: 55, y: 43 },
    { kind: 'armor', x: 57, y: 43 },
    { kind: 'potion', x: 59, y: 40 },
  ],
};

function generateTestFloor(rng) {
  const L = TEST_LAYOUT;
  const tiles = emptyTiles();
  const rooms = [L.roomA, L.roomB, L.roomC, L.roomD];
  for (const room of rooms) carveRoom(tiles, room);
  for (const c of [L.corridorRight, L.corridorDown, L.corridorUp]) {
    for (let y = c.y; y < c.y + c.h; y++) {
      for (let x = c.x; x < c.x + c.w; x++) tiles[y][x] = TILE.FLOOR;
    }
  }
  tiles[L.stairs.y][L.stairs.x] = TILE.STAIRS;

  const items = L.itemsB.map((spec) => {
    const item = makeItem(spec.kind, 1, rng);
    item.x = spec.x;
    item.y = spec.y;
    return item;
  });

  const enemies = [makeEnemy(1, L.goblinB.x, L.goblinB.y, 1, { patrols: false })];
  for (const g of L.goblinsC) enemies.push(makeEnemy(1, g.x, g.y, 2, { patrols: false }));

  return {
    tiles,
    rooms,
    startRoomIndex: 0,
    stairsRoomIndex: 3,
    playerStart: { ...L.playerStart },
    stairsPos: { ...L.stairs },
    items,
    enemies,
  };
}

// ----------------------------------------------------------- entry point ----

// FR-039: seed 99999 + floor 1 => deterministic test dungeon; every other
// (seed, floor) combination uses normal BSP procedural generation.
function generateFloor(rng, floor, seed) {
  if (seed === TEST_SEED && floor === 1) return generateTestFloor(rng);
  return generateBspFloor(rng, floor);
}


// ===== src/game.js =====
// Core game state machine — pure logic, no DOM. Drives movement, combat,
// items/inventory, fog-of-war, floor descent, game-over/victory and the HUD
// log. Rendering subscribes to this state (src/render.js).






const MODE = {
  PLAY: 'play',
  INVENTORY: 'inventory',
  GAME_OVER: 'gameover',
  VICTORY: 'victory',
};

class Game {
  // opts: { explicitSeed: number|null, now: () => number }
  constructor(opts = {}) {
    this.explicitSeed = opts.explicitSeed ?? null;
    this.now = opts.now ?? (() => Date.now());
    this._startRun();
  }

  _startRun() {
    // FR-038: explicit URL seed when present, otherwise auto-generated.
    this.seed = this.explicitSeed ?? Math.floor(this.now()) % 2147483647;
    this.rng = new Rng(this.seed);
    this.mode = MODE.PLAY;
    this.turn = 0;
    this.enemiesDefeated = 0;
    this.log = []; // FR-018 rolling 50-line buffer
    this.player = {
      x: 0,
      y: 0,
      hp: 20,
      maxHp: 20,
      baseAttack: 5,
      baseDefense: 1,
      weapon: null, // equipped weapon item or null
      armor: null, // equipped armor item or null
      level: 1, // FR-016: level == floor, display only
      floor: 1,
      inventory: [], // ordered, max 10 (FR-009)
    };
    this.invCursor = 0;
    this._enterFloor(1);
    logEvent('info', 'game', `run started (seed ${this.seed})`, { seed: this.seed });
    this.pushLog(`You enter the dungeon. (seed ${this.seed})`);
  }

  // ---------------------------------------------------------- derived ----

  get attack() {
    // FR-005: displayed/effective attack = base + equipped weapon bonus
    return this.player.baseAttack + (this.player.weapon ? this.player.weapon.value : 0);
  }

  get defense() {
    return this.player.baseDefense + (this.player.armor ? this.player.armor.value : 0);
  }

  // SC-006 / FR-033: control hint shown on floor 1, hidden after first descent.
  get hintVisible() {
    return this.player.floor === 1;
  }

  // ------------------------------------------------------------ floors ----

  _enterFloor(floor) {
    const t0 =
      typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
    this.player.floor = floor;
    this.player.level = floor; // FR-016
    this.floorData = generateFloor(this.rng, floor, this.seed);
    this.visited = makeVisited(); // FR-003: fog resets per floor
    this.player.x = this.floorData.playerStart.x;
    this.player.y = this.floorData.playerStart.y;
    markVisible(this.visited, this.player.x, this.player.y);
    const t1 =
      typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
    logEvent('info', 'dungeon', `floor ${floor} generated in ${(t1 - t0).toFixed(1)}ms`, {
      floor,
      rooms: this.floorData.rooms.length,
      enemies: this.floorData.enemies.length,
      items: this.floorData.items.length,
    });
  }

  // -------------------------------------------------------------- HUD ----

  pushLog(line) {
    this.log.push(line);
    if (this.log.length > LOG_LINES) this.log.splice(0, this.log.length - LOG_LINES); // FR-018
  }

  // ------------------------------------------------------------ lookup ----

  tileAt(x, y) {
    if (x < 0 || y < 0 || x >= GRID_W || y >= GRID_H) return TILE.WALL;
    return this.floorData.tiles[y][x];
  }

  enemyAt(x, y) {
    return this.floorData.enemies.find((e) => e.x === x && e.y === y) ?? null;
  }

  itemAt(x, y) {
    return this.floorData.items.find((it) => it.x === x && it.y === y) ?? null;
  }

  visibility(x, y) {
    return visibilityAt(this.visited, this.player.x, this.player.y, x, y);
  }

  // ------------------------------------------------------------- turns ----

  // Player turn: attempt to move/attack one tile in (dx, dy).
  // Blocked moves (walls/bounds) change nothing and consume no turn
  // (US1-AS4: movement is blocked, no position change).
  step(dx, dy) {
    if (this.mode !== MODE.PLAY) return;
    dx = Math.sign(dx);
    dy = Math.sign(dy);
    if (dx === 0 && dy === 0) return;
    this.turn++;
    const nx = this.player.x + dx;
    const ny = this.player.y + dy;
    if (this.tileAt(nx, ny) === TILE.WALL) return; // blocked, no enemy turn

    const enemy = this.enemyAt(nx, ny);
    if (enemy) {
      // FR-007: bump-attack; player stays in place.
      this._playerAttack(enemy);
    } else {
      this.player.x = nx;
      this.player.y = ny;
      const item = this.itemAt(nx, ny);
      if (item) this._pickup(item);
      if (this.tileAt(nx, ny) === TILE.STAIRS) {
        // FR-011: descent is immediate; enemies take no turn this round.
        this._descend();
        return;
      }
    }
    this._afterPlayerAction();
  }

  _playerAttack(enemy) {
    const dmg = damage(this.attack, enemy.defense);
    enemy.hp -= dmg;
    if (enemy.hp <= 0) {
      this.enemiesDefeated++;
      this.floorData.enemies = this.floorData.enemies.filter((e) => e !== enemy);
      this.pushLog(`You hit ${enemy.type} for ${dmg}. ${enemy.type} dies!`);
      logEvent('info', 'combat', `${enemy.type} defeated`, {
        floor: this.player.floor,
        defeated: this.enemiesDefeated,
      });
      // US2-AS5: 25% chance to drop a random item on the enemy's tile.
      if (this.rng.chance(0.25)) {
        if (!this.itemAt(enemy.x, enemy.y) && this.tileAt(enemy.x, enemy.y) === TILE.FLOOR) {
          const item = randomItem(this.player.floor, this.rng);
          item.x = enemy.x;
          item.y = enemy.y;
          this.floorData.items.push(item);
          this.pushLog(`${enemy.type} drops ${item.name}.`);
        }
      }
    } else {
      this.pushLog(`You hit ${enemy.type} for ${dmg}.`);
    }
  }

  _pickup(item) {
    if (this.player.inventory.length >= MAX_INVENTORY) {
      // Edge case: full inventory — item stays on the floor, HUD message.
      this.pushLog(`Inventory full! ${item.name} stays on the ground.`);
      return;
    }
    this.floorData.items = this.floorData.items.filter((it) => it !== item);
    delete item.x;
    delete item.y;
    this.player.inventory.push(item);
    this.pushLog(`You pick up ${item.name}.`);
    logEvent('info', 'items', `picked up ${item.name}`, {
      slots: this.player.inventory.length,
    });
  }

  _descend() {
    if (this.player.floor === MAX_FLOOR) {
      // R101: floor 9 staircase => victory, no floor 10.
      this.mode = MODE.VICTORY;
      logEvent('info', 'game', 'victory', {
        floor: this.player.floor,
        defeated: this.enemiesDefeated,
        seed: this.seed,
      });
      return;
    }
    const next = this.player.floor + 1;
    this.pushLog(`You descend to floor ${next}.`);
    this._enterFloor(next); // stats + inventory persist on this.player
  }

  _afterPlayerAction() {
    this._updateActivation();
    this._enemyTurns();
    markVisible(this.visited, this.player.x, this.player.y);
    if (this.player.hp <= 0) {
      this.mode = MODE.GAME_OVER;
      logEvent('info', 'game', 'game over', {
        floor: this.player.floor,
        defeated: this.enemiesDefeated,
        seed: this.seed,
      });
    }
  }

  // R103: room-wide aggro the moment the player's tile belongs to a room.
  _updateActivation() {
    const { rooms, enemies } = this.floorData;
    for (let r = 0; r < rooms.length; r++) {
      if (tileInRoom(rooms[r], this.player.x, this.player.y)) {
        for (const e of enemies) {
          if (e.roomIndex === r && !e.activated) {
            e.activated = true;
          }
        }
      }
    }
  }

  // Walkability for enemies: floor tiles only (stairs are non-walkable for
  // enemies per clarification 2026-06-26), one enemy per tile (FR-026),
  // never the player's tile. Items are ignored (enemies pass over them).
  _enemyCanMoveTo(x, y) {
    if (this.tileAt(x, y) !== TILE.FLOOR) return false;
    if (x === this.player.x && y === this.player.y) return false;
    if (this.enemyAt(x, y)) return false;
    return true;
  }

  _enemyTurns() {
    // Iterate over a snapshot in array order — FR-026 iteration-order
    // collision applies to pursuit AND patrol.
    const enemies = this.floorData.enemies.slice();
    for (const e of enemies) {
      if (this.player.hp <= 0) return;
      if (e.activated) {
        if (chebyshev(e.x, e.y, this.player.x, this.player.y) <= 1) {
          // FR-022: adjacent (8-dir) => attack, no movement this turn.
          const dmg = damage(e.attack, this.defense);
          this.player.hp -= dmg;
          this.pushLog(`${e.type} hits you for ${dmg}.`);
        } else {
          this._pursue(e);
        }
      } else if (e.patrols !== false) {
        this._patrol(e);
      }
    }
  }

  // FR-022 greedy step with wall-sliding: preferred step toward the player
  // (diagonal when both axes differ), else primary axis, else secondary
  // axis; when moving straight, slide diagonally around obstacles. No
  // pathfinding. Blocked everywhere => stay in place.
  _pursue(e) {
    const dx = Math.sign(this.player.x - e.x);
    const dy = Math.sign(this.player.y - e.y);
    const candidates = [];
    if (dx !== 0 && dy !== 0) {
      candidates.push([dx, dy]);
      if (Math.abs(this.player.x - e.x) >= Math.abs(this.player.y - e.y)) {
        candidates.push([dx, 0], [0, dy]);
      } else {
        candidates.push([0, dy], [dx, 0]);
      }
    } else if (dx !== 0) {
      candidates.push([dx, 0], [dx, -1], [dx, 1]);
    } else {
      candidates.push([0, dy], [-1, dy], [1, dy]);
    }
    for (const [cx, cy] of candidates) {
      if (this._enemyCanMoveTo(e.x + cx, e.y + cy)) {
        e.x += cx;
        e.y += cy;
        return;
      }
    }
    // no viable move — stay in place
  }

  // R103: unactivated enemies patrol randomly inside their spawning room —
  // one step to a random adjacent walkable tile within the room boundary.
  _patrol(e) {
    const room = this.floorData.rooms[e.roomIndex];
    if (!room) return;
    const options = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = e.x + dx;
        const ny = e.y + dy;
        if (!tileInRoom(room, nx, ny)) continue;
        if (!this._enemyCanMoveTo(nx, ny)) continue;
        options.push([nx, ny]);
      }
    }
    if (options.length === 0) return;
    const [nx, ny] = this.rng.pick(options);
    e.x = nx;
    e.y = ny;
  }

  // --------------------------------------------------------- inventory ----

  // FR-019: `I` toggles the inventory screen; the game loop pauses while
  // open (no enemy turns happen from inventory actions).
  openInventory() {
    if (this.mode !== MODE.PLAY) return;
    this.mode = MODE.INVENTORY;
    this.invCursor = 0;
  }

  closeInventory() {
    if (this.mode !== MODE.INVENTORY) return;
    this.mode = MODE.PLAY;
  }

  moveInventoryCursor(delta) {
    if (this.mode !== MODE.INVENTORY) return;
    const max = Math.max(0, MAX_INVENTORY - 1);
    this.invCursor = Math.min(max, Math.max(0, this.invCursor + delta));
  }

  // Use/equip the selected item (Enter). Potions are consumed; weapons and
  // armor swap with the currently equipped item (FR-019 swap semantics —
  // always succeeds regardless of inventory occupancy).
  useSelected() {
    if (this.mode !== MODE.INVENTORY) return;
    const idx = this.invCursor;
    const item = this.player.inventory[idx];
    if (!item) return;
    if (item.kind === 'potion') {
      // Edge case: potion at full HP is still consumed; HP capped at max.
      const before = this.player.hp;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + item.value);
      this.player.inventory.splice(idx, 1);
      this.pushLog(`You drink ${item.name}. (+${this.player.hp - before} HP)`);
    } else if (item.kind === 'weapon') {
      const prev = this.player.weapon;
      this.player.weapon = item;
      if (prev) this.player.inventory[idx] = prev;
      else this.player.inventory.splice(idx, 1);
      this.pushLog(`You equip ${item.name}.`);
    } else if (item.kind === 'armor') {
      const prev = this.player.armor;
      this.player.armor = item;
      if (prev) this.player.inventory[idx] = prev;
      else this.player.inventory.splice(idx, 1);
      this.pushLog(`You equip ${item.name}.`);
    }
    if (this.invCursor >= this.player.inventory.length && this.invCursor > 0) {
      this.invCursor = Math.max(0, this.player.inventory.length - 1);
    }
  }

  // ------------------------------------------------------------ restart ----

  // FR-008 / R101: `R` on the game-over or victory screen restarts from
  // floor 1 with fresh stats. An explicit URL seed is reused (reproducible);
  // auto-seeded runs get a fresh auto seed.
  restart() {
    if (this.mode !== MODE.GAME_OVER && this.mode !== MODE.VICTORY) return;
    this._startRun();
  }

  // Convenience for renderers/tests: is (x,y) lit right now?
  litAt(x, y) {
    return isLit(this.player.x, this.player.y, x, y);
  }
}


// ===== src/input.js =====
// Keyboard input logic (FR-004, FR-027) — pure, DOM-free, testable.
// WASD and arrow keys, 8-directional. Sequential presses before a turn
// resolves: last one wins (earlier queued inputs are discarded). Keys held
// simultaneously combine into a single diagonal input.

const KEY_DIRS = {
  w: [0, -1],
  a: [-1, 0],
  s: [0, 1],
  d: [1, 0],
  arrowup: [0, -1],
  arrowleft: [-1, 0],
  arrowdown: [0, 1],
  arrowright: [1, 0],
};

function isMovementKey(key) {
  return Object.prototype.hasOwnProperty.call(KEY_DIRS, key.toLowerCase());
}

// Combine the direction vectors of all currently-held movement keys into a
// single move (each axis clamped to -1..1). W+A => up-left; opposing keys
// cancel on that axis.
function combineHeld(heldKeys) {
  let dx = 0;
  let dy = 0;
  for (const key of heldKeys) {
    const dir = KEY_DIRS[key.toLowerCase()];
    if (!dir) continue;
    dx += dir[0];
    dy += dir[1];
  }
  return [Math.max(-1, Math.min(1, dx)), Math.max(-1, Math.min(1, dy))];
}

// Input queue with FR-027 semantics: holds at most ONE pending move — each
// new keypress replaces (discards) whatever was queued before it, so only
// the last keypress before the turn resolves is processed.
class InputQueue {
  constructor() {
    this.held = new Set();
    this.pending = null;
  }

  // Register a keydown. Returns true if the key was a movement key.
  keyDown(key) {
    const k = key.toLowerCase();
    if (!isMovementKey(k)) return false;
    this.held.add(k);
    const [dx, dy] = combineHeld(this.held);
    if (dx === 0 && dy === 0) {
      // opposing keys cancelled — fall back to the key just pressed
      this.pending = KEY_DIRS[k].slice();
    } else {
      this.pending = [dx, dy];
    }
    return true;
  }

  keyUp(key) {
    this.held.delete(key.toLowerCase());
  }

  clearHeld() {
    this.held.clear();
  }

  // Take the single pending move (or null). Clears the queue.
  consume() {
    const p = this.pending;
    this.pending = null;
    return p;
  }
}


// ===== src/render.js =====
// DOM renderer (FR-001, FR-012, FR-015, FR-032, FR-033, FR-034, FR-035,
// R102). Builds the layout once, then re-renders only cells whose content
// changed (FR-028/FR-029/SC-005 — no unbounded growth, per-turn updates stay
// tiny). Pure DOM; all game logic lives in game.js.



class Renderer {
  constructor(root, game) {
    this.root = root;
    this.game = game;
    this._buildLayout();
    this._cache = new Array(GRID_W * GRID_H).fill('');
  }

  _buildLayout() {
    const doc = this.root.ownerDocument;
    this.root.innerHTML = '';

    // Header (FR-033): max 3 lines — stats + log left, controls hint right.
    const header = doc.createElement('header');
    header.id = 'hud';
    const left = doc.createElement('div');
    left.id = 'hud-left';
    this.statsEl = doc.createElement('div');
    this.statsEl.id = 'stats';
    this.logEl = doc.createElement('div');
    this.logEl.id = 'log';
    left.appendChild(this.statsEl);
    left.appendChild(this.logEl);
    this.hintEl = doc.createElement('div');
    this.hintEl.id = 'hint';
    this.hintEl.textContent = 'WASD/Arrows to move · I for inventory · Reach > to descend';
    header.appendChild(left);
    header.appendChild(this.hintEl);
    this.root.appendChild(header);

    // Scrollable grid viewport (FR-034) — focusable (FR-030), scrollbars
    // hidden via CSS (FR-033).
    this.viewport = doc.createElement('div');
    this.viewport.id = 'viewport';
    this.viewport.tabIndex = 0;
    this.grid = doc.createElement('div');
    this.grid.id = 'grid';
    this.cells = new Array(GRID_W * GRID_H);
    for (let y = 0; y < GRID_H; y++) {
      const row = doc.createElement('div');
      row.className = 'row';
      for (let x = 0; x < GRID_W; x++) {
        const cell = doc.createElement('span');
        cell.className = 't hid';
        cell.dataset.x = String(x);
        cell.dataset.y = String(y);
        row.appendChild(cell);
        this.cells[y * GRID_W + x] = cell;
      }
      this.grid.appendChild(row);
    }
    this.viewport.appendChild(this.grid);
    this.root.appendChild(this.viewport);

    // Full-viewport overlays (FR-035) — completely hidden when inactive.
    this.invOverlay = this._makeOverlay(doc, 'overlay-inventory');
    this.gameOverOverlay = this._makeOverlay(doc, 'overlay-gameover');
    this.victoryOverlay = this._makeOverlay(doc, 'overlay-victory');
  }

  _makeOverlay(doc, id) {
    const el = doc.createElement('div');
    el.id = id;
    el.className = 'overlay';
    el.setAttribute('hidden', '');
    this.root.appendChild(el);
    return el;
  }

  // Full render pass: HUD, changed grid cells, overlays, scroll position.
  render() {
    const g = this.game;
    this._renderHud();
    this._renderGrid();
    this._renderOverlays();
    this._centerOnPlayer();
    this.root.ownerDocument.body.dataset.turn = String(g.turn);
    this.root.ownerDocument.body.dataset.mode = g.mode;
    this.root.ownerDocument.body.dataset.floor = String(g.player.floor);
  }

  _renderHud() {
    const g = this.game;
    this.statsEl.textContent =
      `HP ${g.player.hp}/${g.player.maxHp}  ATK ${g.attack}  DEF ${g.defense}` +
      `  LVL ${g.player.level}  Floor ${g.player.floor}  Kills ${g.enemiesDefeated}`;
    // FR-018: render the retained rolling buffer (≤50 lines); CSS caps the
    // visible height and keeps it scrolled to the newest lines.
    const doc = this.root.ownerDocument;
    this.logEl.innerHTML = '';
    for (const line of this.game.log) {
      const div = doc.createElement('div');
      div.textContent = line;
      this.logEl.appendChild(div);
    }
    this.logEl.scrollTop = this.logEl.scrollHeight;
    // SC-006: hint hidden after the first descent.
    if (g.hintVisible) this.hintEl.removeAttribute('hidden');
    else this.hintEl.setAttribute('hidden', '');
  }

  // Desired glyph+class for a cell — entity precedence: player > enemy >
  // item > terrain. Enemies/items render only on lit tiles (FR-032); dimmed
  // tiles show terrain only; hidden tiles show nothing (black).
  _cellState(x, y) {
    const g = this.game;
    const vis = g.visibility(x, y);
    if (vis === VIS.HIDDEN) return ' |hid';
    const tile = g.tileAt(x, y);
    if (vis === VIS.DIM) {
      const glyph = tile === TILE.WALL ? GLYPHS.wall : tile === TILE.STAIRS ? GLYPHS.stairs : GLYPHS.floor;
      return `${glyph}|dim`;
    }
    // lit
    if (g.player.x === x && g.player.y === y) return `${GLYPHS.player}|lit player`;
    const enemy = g.enemyAt(x, y);
    if (enemy) return `${enemy.glyph}|lit enemy`;
    const item = g.itemAt(x, y);
    if (item) return `${item.glyph}|lit item`;
    const glyph = tile === TILE.WALL ? GLYPHS.wall : tile === TILE.STAIRS ? GLYPHS.stairs : GLYPHS.floor;
    return `${glyph}|lit terrain`;
  }

  _renderGrid() {
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const i = y * GRID_W + x;
        const state = this._cellState(x, y);
        if (state === this._cache[i]) continue; // only re-render changes
        this._cache[i] = state;
        const [glyph, cls] = state.split('|');
        const cell = this.cells[i];
        cell.textContent = glyph;
        cell.className = `t ${cls}`;
      }
    }
  }

  _renderOverlays() {
    const g = this.game;
    this._setOverlay(this.invOverlay, g.mode === MODE.INVENTORY, () => this._inventoryHtml());
    this._setOverlay(this.gameOverOverlay, g.mode === MODE.GAME_OVER, () =>
      this._endHtml('GAME OVER', 'You died.'),
    );
    this._setOverlay(this.victoryOverlay, g.mode === MODE.VICTORY, () =>
      this._endHtml('VICTORY!', 'You conquered the dungeon.'),
    );
  }

  _setOverlay(el, active, html) {
    if (active) {
      el.innerHTML = html();
      el.removeAttribute('hidden');
    } else {
      el.setAttribute('hidden', '');
      el.innerHTML = '';
    }
  }

  _esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  _inventoryHtml() {
    const g = this.game;
    const rows = [];
    for (let i = 0; i < MAX_INVENTORY; i++) {
      const item = g.player.inventory[i];
      const cursor = i === g.invCursor ? '&gt; ' : '&nbsp;&nbsp;';
      const label = item ? this._esc(item.name) : '<span class="empty">- empty -</span>';
      const sel = i === g.invCursor ? ' selected' : '';
      rows.push(`<div class="slot${sel}">${cursor}${i + 1}. ${label}</div>`);
    }
    const weapon = g.player.weapon ? this._esc(g.player.weapon.name) : 'none';
    const armor = g.player.armor ? this._esc(g.player.armor.name) : 'none';
    return (
      `<div class="panel"><h2>INVENTORY</h2>` +
      `<div class="equipped">Equipped weapon: ${weapon} · Equipped armor: ${armor}</div>` +
      rows.join('') +
      `<div class="help">Arrows: select · Enter: use/equip · Esc: close</div></div>`
    );
  }

  _endHtml(title, blurb) {
    const g = this.game;
    return (
      `<div class="panel"><h2>${title}</h2><p>${blurb}</p>` +
      `<p>Floor reached: ${g.player.floor} · Enemies defeated: ${g.enemiesDefeated}</p>` +
      `<p>Seed: ${g.seed}</p>` +
      `<p class="help">Press R to restart</p></div>`
    );
  }

  // FR-034: keep the player centered/visible in the scrollable viewport.
  _centerOnPlayer() {
    const cell = this.cells[this.game.player.y * GRID_W + this.game.player.x];
    if (!cell || typeof cell.offsetLeft !== 'number') return;
    const vp = this.viewport;
    // offsets are relative to the offsetParent (body) — make them relative
    // to the viewport box before centering
    vp.scrollLeft = cell.offsetLeft - vp.offsetLeft + cell.offsetWidth / 2 - vp.clientWidth / 2;
    vp.scrollTop = cell.offsetTop - vp.offsetTop + cell.offsetHeight / 2 - vp.clientHeight / 2;
  }
}


// ===== src/main.js =====
// Browser bootstrap: seed parsing (FR-038), game + renderer wiring, keyboard
// handling (FR-004/FR-027/FR-019/FR-008/R101), rAF-batched turn processing.






function boot(win) {
  const w = win ?? window;
  const doc = w.document;
  const explicitSeed = parseSeedParam(w.location.search);
  const game = new Game({ explicitSeed });

  let root = doc.getElementById('app');
  if (!root) {
    root = doc.createElement('div');
    root.id = 'app';
    doc.body.appendChild(root);
  }
  const renderer = new Renderer(root, game);
  const input = new InputQueue();

  renderer.render();
  renderer.viewport.focus(); // FR-030: keyboard works with no mouse click

  let scheduled = false;
  function scheduleTurn() {
    if (scheduled) return;
    scheduled = true;
    w.requestAnimationFrame(() => {
      scheduled = false;
      const move = input.consume(); // FR-027: only the last queued keypress
      if (move && game.mode === MODE.PLAY) {
        game.step(move[0], move[1]);
        renderer.render();
      }
    });
  }

  w.addEventListener('keydown', (ev) => {
    const key = ev.key;
    const lower = key.toLowerCase();

    if (game.mode === MODE.GAME_OVER || game.mode === MODE.VICTORY) {
      if (lower === 'r') {
        game.restart();
        renderer.render();
        renderer.viewport.focus();
      }
      ev.preventDefault();
      return;
    }

    if (game.mode === MODE.INVENTORY) {
      if (lower === 'escape' || lower === 'i') {
        game.closeInventory();
      } else if (lower === 'arrowup' || lower === 'w') {
        game.moveInventoryCursor(-1);
      } else if (lower === 'arrowdown' || lower === 's') {
        game.moveInventoryCursor(1);
      } else if (lower === 'enter') {
        game.useSelected();
      }
      renderer.render();
      ev.preventDefault();
      return;
    }

    // PLAY mode
    if (lower === 'i') {
      game.openInventory();
      renderer.render();
      ev.preventDefault();
      return;
    }
    if (isMovementKey(lower)) {
      input.keyDown(lower); // held keys combine into diagonals (FR-027)
      scheduleTurn();
      ev.preventDefault();
    }
  });

  w.addEventListener('keyup', (ev) => input.keyUp(ev.key));
  w.addEventListener('blur', () => input.clearHeld());

  logEvent('info', 'boot', `game booted (seed ${game.seed})`, { seed: game.seed });
  return { game, renderer, input };
}

// Auto-boot in a real browser (the inlined artifact relies on this).
if (typeof window !== 'undefined' && typeof document !== 'undefined' && !window.__NO_AUTOBOOT__) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => boot(window));
  } else {
    boot(window);
  }
}

})();
</script>
</body>
</html>
