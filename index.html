<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro Dungeon Crawler</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 14px/18px "Courier New", Courier, monospace; color: #9e9e9e; }
  #app { display: flex; flex-direction: column; height: 100%; }
  /* Header: max 3 lines (54px), stats+log left, controls hint right (FR-033).
     Spacing between the two columns uses a margin, not flex gap — flex gap
     needs Safari 14.1+ and FR-014 targets Safari 14+. */
  #hud { flex: 0 0 auto; max-height: 54px; height: 54px; display: flex;
         justify-content: space-between; padding: 0 8px; overflow: hidden; }
  #hud-left { overflow: hidden; min-width: 0; }
  #stats { white-space: nowrap; color: #9e9e9e; }
  #log { height: 36px; overflow-y: auto; scrollbar-width: none; white-space: pre; color: #9e9e9e; }
  #log::-webkit-scrollbar { display: none; }
  #hud-right { white-space: nowrap; color: #9e9e9e; margin-left: 16px; }
  /* Grid viewport: fills the rest, centered, scrollable without visible
     scrollbars (FR-033/FR-034) */
  #viewport { flex: 1 1 auto; overflow: auto; scrollbar-width: none; }
  #viewport::-webkit-scrollbar { display: none; }
  #grid { position: relative; width: max-content; margin: 0 auto; outline: none; }
  #grid:focus { box-shadow: 0 0 0 1px #4a4a4a; } /* visible focus feedback (FR-030) */
  .row { white-space: pre; height: 16px; }
  .cell { display: inline-block; width: 9px; height: 16px; text-align: center;
          font-size: 13px; line-height: 16px; }
  /* R102 palette: black bg; walls+staircase grey; dimmed fog dark grey;
     player white; enemies light brown; items light blue. Nothing else. */
  .c-hidden { color: #000; }
  .c-dim { color: #4a4a4a; }
  .c-wall, .c-floor, .c-stairs { color: #9e9e9e; }
  .c-player { color: #ffffff; }
  .c-enemy { color: #c9975b; }
  .c-item { color: #8fd0ff; }
  /* Full-viewport overlays, invisible when inactive (FR-035). Offsets use the
     four longhands, NOT the "inset" shorthand: inset needs Safari 14.1+ and
     FR-014 targets Safari 14+, where an ignored shorthand would collapse the
     overlay off-viewport. Overlay text is the wall grey (R102 palette). */
  .overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0;
             background: #000; color: #9e9e9e;
             display: none; padding: 48px; white-space: pre; z-index: 10;
             font: 16px/24px "Courier New", Courier, monospace; }
  .overlay.open { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
// ===== src/constants.js =====
// Game-wide constants. Values are mandated by the spec:
// grid (FR-020), sight radius (R100), inventory cap (FR-009),
// log buffer (FR-018), max floor (R101), hint text (SC-006).
const GRID_W = 80;
const GRID_H = 80;
const SIGHT_RADIUS = 5;
const MAX_FLOOR = 9;
const INVENTORY_CAP = 10;
const LOG_MAX = 50;
const TEST_SEED = 99999;

const TILE_WALL = 0;
const TILE_FLOOR = 1;
const TILE_STAIRS = 2;

const PLAYER_BASE_HP = 20;
const PLAYER_BASE_ATK = 5;
const PLAYER_BASE_DEF = 1;

const CONTROL_HINT = 'WASD/Arrows to move · I for inventory · Reach > to descend';

// ===== src/logger.js =====
// Structured developer-facing logging (FR-037): timestamp, level, component,
// message — emitted to the browser console (DevTools only), never to the HUD.
function createLogger(sink, clock) {
  const out = sink || (typeof console !== 'undefined' ? console : null);
  const now = clock || (() => new Date().toISOString());
  function emit(level, component, message) {
    if (!out) return;
    const line = `[${now()}] [${level}] [${component}] ${message}`;
    if (level === 'error' && out.error) out.error(line);
    else if (level === 'warn' && out.warn) out.warn(line);
    else if (out.info) out.info(line);
  }
  return {
    info: (component, message) => emit('info', component, message),
    warn: (component, message) => emit('warn', component, message),
    error: (component, message) => emit('error', component, message),
  };
}

// ===== src/rng.js =====
// Seeded RNG (FR-038): every random decision in a run flows through one
// mulberry32 stream, so a run is fully reproducible from its seed.
function createRng(seed) {
  let a = seed >>> 0;
  function next() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    seed,
    next,
    int(min, max) {
      return min + Math.floor(next() * (max - min + 1));
    },
    chance(p) {
      return next() < p;
    },
    pick(arr) {
      return arr[Math.floor(next() * arr.length)];
    },
  };
}

// Parses `?seed=N` from a query string (FR-038). Non-integer values are NaN
// and fall back to the auto seed (Session 2026-06-26); absent param likewise.
function parseSeedParam(search, fallback) {
  const auto = fallback || Date.now;
  let raw = null;
  const query = (search || '').replace(/^\?/, '');
  for (const pair of query.split('&')) {
    const eq = pair.indexOf('=');
    if (eq > 0 && decodeURIComponent(pair.slice(0, eq)) === 'seed') {
      raw = decodeURIComponent(pair.slice(eq + 1));
    }
  }
  if (raw !== null) {
    const v = parseInt(raw, 10);
    if (!Number.isNaN(v)) return v;
  }
  return Math.floor(auto());
}

// ===== src/entities.js =====
// Entity factories: enemies (FR-006 formulas) and items (Item entity formulas).

const ENEMY_TYPES = [
  { name: 'Goblin', glyph: 'g', maxFloor: 3 },
  { name: 'Orc', glyph: 'o', maxFloor: 6 },
  { name: 'Wraith', glyph: 'w', maxFloor: 9 },
];

function enemyTypeForFloor(floor) {
  for (const t of ENEMY_TYPES) {
    if (floor <= t.maxFloor) return t;
  }
  return ENEMY_TYPES[ENEMY_TYPES.length - 1];
}

// HP = 10 + floor*5, atk = 3 + floor*2, def = floor (Enemy entity definition).
function makeEnemy(floor, x, y, roomIndex) {
  const type = enemyTypeForFloor(floor);
  const hp = 10 + floor * 5;
  return {
    name: type.name,
    glyph: type.glyph,
    x,
    y,
    hp,
    maxHp: hp,
    atk: 3 + floor * 2,
    def: floor,
    roomIndex,
    activated: false,
  };
}

const ITEM_KINDS = ['potion', 'weapon', 'armor'];

// potion restore = 10 + floor*5; weapon/armor bonus = floor + random(0..2).
function makeItem(kind, floor, rng) {
  if (kind === 'potion') {
    return { kind, name: 'Potion', glyph: '!', value: 10 + floor * 5 };
  }
  const value = floor + rng.int(0, 2);
  if (kind === 'weapon') return { kind, name: 'Weapon', glyph: '/', value };
  return { kind: 'armor', name: 'Armor', glyph: '[', value };
}

function makeRandomItem(floor, rng) {
  return makeItem(rng.pick(ITEM_KINDS), floor, rng);
}

// Inventory display label with effect (US3-AS5).
function itemLabel(item) {
  if (item.kind === 'potion') return `${item.name} (+${item.value} HP)`;
  if (item.kind === 'weapon') return `${item.name} (+${item.value} ATK)`;
  return `${item.name} (+${item.value} DEF)`;
}

// ===== src/input.js =====
// Keyboard input mapping (FR-004, FR-027).
const KEY_DIRS = {
  w: [0, -1],
  a: [-1, 0],
  s: [0, 1],
  d: [1, 0],
  arrowup: [0, -1],
  arrowleft: [-1, 0],
  arrowdown: [0, 1],
  arrowright: [1, 0],
};

function normalizeKey(key) {
  return String(key).toLowerCase();
}

function isDirectionKey(key) {
  return Object.prototype.hasOwnProperty.call(KEY_DIRS, key);
}

// Resolves the movement vector for a keypress. `held` is the set of direction
// keys physically held at that moment: a held key on the OTHER axis combines
// into a single diagonal move (simultaneous two-key diagonal, FR-027); a held
// key on the SAME axis is overridden by the newest press (last-keypress-wins).
function resolveMove(key, held) {
  const dir = KEY_DIRS[key];
  if (!dir) return null;
  let [dx, dy] = dir;
  for (const h of held) {
    if (h === key) continue;
    const other = KEY_DIRS[h];
    if (!other) continue;
    if (other[0] !== 0 && dx === 0) dx = other[0];
    if (other[1] !== 0 && dy === 0) dy = other[1];
  }
  return [dx, dy];
}

// Turn coalescer (FR-027): direction keydowns landing within one scheduling
// window (one animation frame in the browser) merge into a SINGLE turn instead
// of resolving as sequential presses. The newest key of the window wins as the
// primary direction (last-keypress-wins); cross-axis combination with the held
// set happens later in resolveTurn via resolveMove, so a near-simultaneous
// two-key press produces exactly one diagonal move and ONE enemy response.
//
// `schedule(cb)` defers cb (requestAnimationFrame in production, a fake in
// unit tests); `resolveTurn(key)` executes the coalesced turn.
function createTurnCoalescer(schedule, resolveTurn) {
  let pendingKey = null;
  let scheduled = false;

  // Resolves the pending turn NOW. Called by the scheduler, and synchronously
  // from keyup so a completed press never waits on the next frame (SC-005).
  function flush() {
    const key = pendingKey;
    pendingKey = null;
    if (key !== null) resolveTurn(key);
  }

  return {
    press(key) {
      pendingKey = key; // newest press of the window wins (FR-027)
      if (!scheduled) {
        scheduled = true;
        schedule(() => {
          scheduled = false;
          flush();
        });
      }
    },
    flush,
    // Drops any pending turn (restart, focus loss). A still-scheduled callback
    // then flushes a null key and does nothing.
    cancel() {
      pendingKey = null;
    },
  };
}

// ===== src/dungeon.js =====
// Dungeon generation: BSP procedural floors (FR-017, FR-020, FR-013, FR-024,
// FR-006, FR-025) and the deterministic seed-99999 test hub on floor 1 (FR-039).


function tileIndex(x, y) {
  return y * GRID_W + x;
}

function inBounds(x, y) {
  return x >= 0 && y >= 0 && x < GRID_W && y < GRID_H;
}

function chebyshev(x1, y1, x2, y2) {
  return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2));
}

function roomContains(room, x, y) {
  return x >= room.x && x < room.x + room.w && y >= room.y && y < room.y + room.h;
}

function roomAt(rooms, x, y) {
  for (let i = 0; i < rooms.length; i++) {
    if (roomContains(rooms[i], x, y)) return i;
  }
  return -1;
}

function carveRect(tiles, x0, y0, w, h, tile) {
  for (let y = y0; y < y0 + h; y++) {
    for (let x = x0; x < x0 + w; x++) tiles[tileIndex(x, y)] = tile;
  }
}

// ---------------------------------------------------------------------------
// Seed 99999, floor 1: deterministic four-room hub (FR-039).
// Room A center hub at grid center; corridors exactly 8 long x 3 wide.
// ---------------------------------------------------------------------------
function generateTestFloor(rng) {
  const tiles = new Uint8Array(GRID_W * GRID_H).fill(TILE_WALL);

  const roomA = { x: 37, y: 37, w: 7, h: 7 }; // spawn hub  (min 5x5)
  const roomB = { x: 52, y: 37, w: 7, h: 7 }; // right: combat/items (min 7x7)
  const roomC = { x: 37, y: 52, w: 7, h: 7 }; // down: death room (min 7x7)
  const roomD = { x: 38, y: 24, w: 5, h: 5 }; // up: staircase room (min 5x5)
  const rooms = [roomA, roomB, roomC, roomD];

  const corridors = [
    { x: 44, y: 39, w: 8, h: 3 }, // A → B, right
    { x: 39, y: 44, w: 3, h: 8 }, // A → C, down
    { x: 39, y: 29, w: 3, h: 8 }, // A → D, up
  ];

  for (const r of rooms) carveRect(tiles, r.x, r.y, r.w, r.h, TILE_FLOOR);
  for (const c of corridors) carveRect(tiles, c.x, c.y, c.w, c.h, TILE_FLOOR);

  const spawn = { x: 40, y: 40 }; // center of Room A
  const stairs = { x: 40, y: 26 }; // Room D, 2 tiles from its entrance (40,28)
  tiles[tileIndex(stairs.x, stairs.y)] = TILE_STAIRS;

  // Room B: exactly one Goblin + exactly eleven items (>=1 of each kind),
  // all within sight radius 5 of the room entrance (52,40).
  const enemies = [
    makeEnemy(1, 55, 40, 1),
    // Room C: exactly three Goblins, within radius 5 of entrance (40,52).
    makeEnemy(1, 38, 54, 2),
    makeEnemy(1, 40, 55, 2),
    makeEnemy(1, 42, 54, 2),
  ];

  const itemPlan = [
    ['potion', 53, 38],
    ['weapon', 54, 38],
    ['armor', 55, 38],
    ['potion', 56, 38],
    ['weapon', 53, 39],
    ['armor', 54, 39],
    ['potion', 53, 41],
    ['weapon', 54, 41],
    ['armor', 53, 42],
    ['potion', 54, 42],
    ['potion', 55, 42],
  ];
  const items = itemPlan.map(([kind, x, y]) => ({ ...makeItem(kind, 1, rng), x, y }));

  return {
    tiles,
    rooms,
    corridors,
    spawn,
    spawnRoom: 0,
    stairs,
    stairsRoom: 3,
    enemies,
    items,
    isTestLayout: true,
  };
}

// ---------------------------------------------------------------------------
// Procedural BSP generation (all other floors/seeds).
// ---------------------------------------------------------------------------
const BSP_MIN_LEAF = 12;

function splitRegion(node, rng, leaves) {
  const canSplitW = node.w >= BSP_MIN_LEAF * 2;
  const canSplitH = node.h >= BSP_MIN_LEAF * 2;
  if (!canSplitW && !canSplitH) {
    leaves.push(node);
    return;
  }
  let vertical;
  if (canSplitW && canSplitH) {
    vertical = node.w === node.h ? rng.chance(0.5) : node.w > node.h;
  } else {
    vertical = canSplitW;
  }
  if (vertical) {
    const cut = rng.int(BSP_MIN_LEAF, node.w - BSP_MIN_LEAF);
    splitRegion({ x: node.x, y: node.y, w: cut, h: node.h, side: 'a' }, rng, leaves);
    splitRegion({ x: node.x + cut, y: node.y, w: node.w - cut, h: node.h, side: 'b' }, rng, leaves);
  } else {
    const cut = rng.int(BSP_MIN_LEAF, node.h - BSP_MIN_LEAF);
    splitRegion({ x: node.x, y: node.y, w: node.w, h: cut, side: 'a' }, rng, leaves);
    splitRegion({ x: node.x, y: node.y + cut, w: node.w, h: node.h - cut, side: 'b' }, rng, leaves);
  }
}

function carveCorridorBetween(tiles, ax, ay, bx, by, rng) {
  // L-shaped, 1 tile wide, horizontal-first or vertical-first at random.
  const horizontalFirst = rng.chance(0.5);
  const carve = (x, y) => {
    if (tiles[tileIndex(x, y)] === TILE_WALL) tiles[tileIndex(x, y)] = TILE_FLOOR;
  };
  if (horizontalFirst) {
    for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) carve(x, ay);
    for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) carve(bx, y);
  } else {
    for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) carve(ax, y);
    for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) carve(x, by);
  }
}

function roomCenter(room) {
  return { x: room.x + Math.floor(room.w / 2), y: room.y + Math.floor(room.h / 2) };
}

// Enemy placement (FR-006): 1-3 per non-starting room; skips tiles holding
// the staircase, an item, or another enemy. A room with no free tile simply
// gets fewer/zero enemies (Edge Case).
function placeEnemies(data, floor, rng) {
  for (let i = 0; i < data.rooms.length; i++) {
    if (i === data.spawnRoom) continue;
    const room = data.rooms[i];
    const count = rng.int(1, 3);
    for (let n = 0; n < count; n++) {
      const free = [];
      for (let y = room.y; y < room.y + room.h; y++) {
        for (let x = room.x; x < room.x + room.w; x++) {
          if (data.tiles[tileIndex(x, y)] !== TILE_FLOOR) continue;
          if (data.items.some((it) => it.x === x && it.y === y)) continue;
          if (data.enemies.some((e) => e.x === x && e.y === y)) continue;
          if (x === data.spawn.x && y === data.spawn.y) continue;
          free.push([x, y]);
        }
      }
      if (free.length === 0) break;
      const [x, y] = free[rng.int(0, free.length - 1)];
      data.enemies.push(makeEnemy(floor, x, y, i));
    }
  }
}

// Floor item placement (Item entity, FR-025): 1-3 items on random walkable
// floor tiles; never the staircase, never a tile already holding an item,
// never under an enemy or the player spawn.
function placeItems(data, floor, rng) {
  const count = rng.int(1, 3);
  let placed = 0;
  let attempts = 0;
  while (placed < count && attempts < 500) {
    attempts++;
    const room = data.rooms[rng.int(0, data.rooms.length - 1)];
    const x = rng.int(room.x, room.x + room.w - 1);
    const y = rng.int(room.y, room.y + room.h - 1);
    if (data.tiles[tileIndex(x, y)] !== TILE_FLOOR) continue;
    if (x === data.spawn.x && y === data.spawn.y) continue;
    if (data.items.some((it) => it.x === x && it.y === y)) continue;
    if (data.enemies.some((e) => e.x === x && e.y === y)) continue;
    data.items.push({ ...makeRandomItem(floor, rng), x, y });
    placed++;
  }
}

function generateProceduralFloor(floor, rng) {
  const tiles = new Uint8Array(GRID_W * GRID_H).fill(TILE_WALL);
  const leaves = [];
  splitRegion({ x: 1, y: 1, w: GRID_W - 2, h: GRID_H - 2 }, rng, leaves);

  // One rectangular room per BSP leaf.
  const rooms = leaves.map((leaf) => {
    const w = rng.int(5, Math.min(leaf.w - 2, 12));
    const h = rng.int(5, Math.min(leaf.h - 2, 12));
    const x = leaf.x + rng.int(1, leaf.w - w - 1);
    const y = leaf.y + rng.int(1, leaf.h - h - 1);
    return { x, y, w, h };
  });
  for (const r of rooms) carveRect(tiles, r.x, r.y, r.w, r.h, TILE_FLOOR);

  // Connectivity by construction: chain each room to the previous one
  // (equivalent to connecting BSP siblings — the leaf order follows the
  // partition tree) — every room is reachable from every other (FR-013).
  for (let i = 1; i < rooms.length; i++) {
    const a = roomCenter(rooms[i - 1]);
    const b = roomCenter(rooms[i]);
    carveCorridorBetween(tiles, a.x, a.y, b.x, b.y, rng);
  }

  // Spawn room and a DIFFERENT staircase room (FR-024). The rejection loop is
  // bounded: after 100 attempts (astronomically unlikely with >=2 rooms) fall
  // back to a deterministic different room rather than spinning forever.
  const spawnRoom = rng.int(0, rooms.length - 1);
  let stairsRoom = spawnRoom;
  for (let attempts = 0; stairsRoom === spawnRoom && attempts < 100; attempts++) {
    stairsRoom = rng.int(0, rooms.length - 1);
  }
  if (stairsRoom === spawnRoom) stairsRoom = (spawnRoom + 1) % rooms.length;
  const spawn = roomCenter(rooms[spawnRoom]);
  const sr = rooms[stairsRoom];
  const stairs = {
    x: rng.int(sr.x, sr.x + sr.w - 1),
    y: rng.int(sr.y, sr.y + sr.h - 1),
  };
  tiles[tileIndex(stairs.x, stairs.y)] = TILE_STAIRS;

  const data = {
    tiles,
    rooms,
    corridors: [],
    spawn,
    spawnRoom,
    stairs,
    stairsRoom,
    enemies: [],
    items: [],
    isTestLayout: false,
  };
  placeItems(data, floor, rng);
  placeEnemies(data, floor, rng);
  return data;
}

// Entry point (FR-002: whole floor generated at floor entry).
function generateFloor(floor, seed, rng) {
  if (seed === TEST_SEED && floor === 1) return generateTestFloor(rng);
  return generateProceduralFloor(floor, rng);
}

// ===== src/game.js =====
// Core turn-based game state and rules.
// Combat (FR-007/FR-021), enemy AI (FR-022/FR-026/R103), items (FR-009/FR-010/
// FR-019/FR-025), fog of war (FR-003/R100), descent & victory (FR-011/R101),
// game over (FR-008), HUD log (FR-018).





function pushLog(state, line) {
  state.log.push(line);
  while (state.log.length > LOG_MAX) state.log.shift();
}

function playerAtk(state) {
  return state.player.baseAtk + (state.player.weapon ? state.player.weapon.value : 0);
}

function playerDef(state) {
  return state.player.baseDef + (state.player.armor ? state.player.armor.value : 0);
}

function enemyAt(state, x, y) {
  return state.enemies.find((e) => e.x === x && e.y === y) || null;
}

function itemAt(state, x, y) {
  return state.items.find((it) => it.x === x && it.y === y) || null;
}

function damage(atk, def) {
  return Math.max(1, atk - def); // FR-021: deterministic, minimum 1
}

// Fog of war (FR-003, R100): lit = within Chebyshev radius 5 of the player;
// dimmed = previously seen; hidden = never seen.
function updateVisibility(state) {
  const { x, y } = state.player;
  for (let ty = Math.max(0, y - SIGHT_RADIUS); ty <= Math.min(GRID_H - 1, y + SIGHT_RADIUS); ty++) {
    for (let tx = Math.max(0, x - SIGHT_RADIUS); tx <= Math.min(GRID_W - 1, x + SIGHT_RADIUS); tx++) {
      state.seen[tileIndex(tx, ty)] = 1;
    }
  }
}

function visibilityAt(state, x, y) {
  if (chebyshev(x, y, state.player.x, state.player.y) <= SIGHT_RADIUS) return 'lit';
  return state.seen[tileIndex(x, y)] ? 'dimmed' : 'hidden';
}

function enterFloor(state, floor) {
  const t0 = typeof performance !== 'undefined' ? performance.now() : 0;
  const data = state.floorGen(floor, state.seed, state.rng);
  const t1 = typeof performance !== 'undefined' ? performance.now() : 0;
  state.floor = floor;
  state.tiles = data.tiles;
  state.rooms = data.rooms;
  state.corridors = data.corridors || [];
  state.spawn = data.spawn;
  state.spawnRoom = data.spawnRoom;
  state.stairs = data.stairs;
  state.enemies = data.enemies;
  state.items = data.items;
  state.player.x = data.spawn.x;
  state.player.y = data.spawn.y;
  state.seen = new Uint8Array(GRID_W * GRID_H); // fresh fog per floor (FR-003)
  updateVisibility(state);
  state.logger.info('dungeon', `floor ${floor} generated in ${(t1 - t0).toFixed(1)}ms: ${data.rooms.length} rooms, ${data.enemies.length} enemies, ${data.items.length} items`);
}

function createGame(seed, floorGen, logger) {
  const state = {
    seed,
    rng: createRng(seed),
    floorGen: floorGen || generateFloor,
    logger: logger || createLogger(),
    status: 'playing', // 'playing' | 'gameover' | 'victory'
    floor: 1,
    enemiesDefeated: 0,
    player: {
      x: 0,
      y: 0,
      hp: PLAYER_BASE_HP,
      maxHp: PLAYER_BASE_HP,
      baseAtk: PLAYER_BASE_ATK,
      baseDef: PLAYER_BASE_DEF,
      weapon: null,
      armor: null,
      inventory: [],
    },
    log: [],
    tiles: null,
    rooms: [],
    corridors: [],
    spawn: { x: 0, y: 0 },
    spawnRoom: 0,
    stairs: { x: 0, y: 0 },
    enemies: [],
    items: [],
    seen: null,
  };
  enterFloor(state, 1);
  pushLog(state, 'You descend into the dungeon. Reach the stairs (>) to go deeper.');
  state.logger.info('game', `run started, seed ${seed}`);
  return state;
}

function killEnemy(state, enemy) {
  const i = state.enemies.indexOf(enemy);
  if (i >= 0) state.enemies.splice(i, 1);
  state.enemiesDefeated++;
  pushLog(state, `${enemy.name} dies.`);
  // 25% drop on the enemy's tile (US2-AS5) — skipped if the tile already
  // holds an item (one item per tile, FR-025).
  if (state.rng.chance(0.25) && !itemAt(state, enemy.x, enemy.y)) {
    const drop = { ...makeRandomItem(state.floor, state.rng), x: enemy.x, y: enemy.y };
    state.items.push(drop);
    pushLog(state, `${enemy.name} drops ${itemLabel(drop)}.`);
  }
}

function activateRoomEnemies(state) {
  // R103: room-wide aggro the moment the player's tile belongs to a room.
  const room = roomAt(state.rooms, state.player.x, state.player.y);
  if (room < 0) return;
  for (const e of state.enemies) {
    if (!e.activated && e.roomIndex === room) e.activated = true;
  }
}

function pickUpItem(state) {
  const item = itemAt(state, state.player.x, state.player.y);
  if (!item) return;
  if (state.player.inventory.length >= INVENTORY_CAP) {
    pushLog(state, `Inventory full — ${itemLabel(item)} stays on the ground.`);
    return;
  }
  state.items.splice(state.items.indexOf(item), 1);
  const { x, y, ...carried } = item;
  state.player.inventory.push(carried);
  pushLog(state, `You pick up ${itemLabel(item)}.`);
}

function playerDies(state) {
  state.player.hp = 0;
  state.status = 'gameover';
  pushLog(state, `You die on floor ${state.floor}.`);
  state.logger.info('game', `game over on floor ${state.floor}, ${state.enemiesDefeated} enemies defeated, seed ${state.seed}`);
}

// One enemy phase (after every real player action). FR-022, FR-026, R103.
function enemyTurn(state) {
  if (state.status !== 'playing') return;
  const occupied = new Set(state.enemies.map((e) => `${e.x},${e.y}`));

  const walkable = (x, y) =>
    inBounds(x, y) &&
    state.tiles[tileIndex(x, y)] === TILE_FLOOR && // walls & stairs excluded
    !(x === state.player.x && y === state.player.y);

  for (const enemy of state.enemies) {
    if (enemy.activated) {
      if (chebyshev(enemy.x, enemy.y, state.player.x, state.player.y) <= 1) {
        // Adjacent (8-directional): attack instead of moving (FR-022).
        const dmg = damage(enemy.atk, playerDef(state));
        state.player.hp -= dmg;
        pushLog(state, `${enemy.name} hits you for ${dmg}.`);
        if (state.player.hp <= 0) {
          playerDies(state);
          return;
        }
        continue;
      }
      // Greedy step with wall-sliding: preferred step, then axis fallbacks.
      const dx = Math.sign(state.player.x - enemy.x);
      const dy = Math.sign(state.player.y - enemy.y);
      const candidates = [[dx, dy]];
      if (dx !== 0 && dy !== 0) {
        if (Math.abs(state.player.x - enemy.x) >= Math.abs(state.player.y - enemy.y)) {
          candidates.push([dx, 0], [0, dy]);
        } else {
          candidates.push([0, dy], [dx, 0]);
        }
      } else if (dx !== 0) {
        candidates.push([dx, -1], [dx, 1]);
      } else {
        candidates.push([-1, dy], [1, dy]);
      }
      for (const [cx, cy] of candidates) {
        const nx = enemy.x + cx;
        const ny = enemy.y + cy;
        if (!walkable(nx, ny)) continue; // terrain block: try the next slide
        if (occupied.has(`${nx},${ny}`)) break; // enemy claim: blocked, stay (FR-026)
        occupied.delete(`${enemy.x},${enemy.y}`);
        occupied.add(`${nx},${ny}`);
        enemy.x = nx;
        enemy.y = ny;
        break;
      }
    } else {
      // Idle patrol inside the spawn room (R103, Session 2026-06-26).
      const room = state.rooms[enemy.roomIndex];
      if (!room) continue;
      const options = [];
      for (let cy = -1; cy <= 1; cy++) {
        for (let cx = -1; cx <= 1; cx++) {
          if (!cx && !cy) continue;
          const nx = enemy.x + cx;
          const ny = enemy.y + cy;
          if (!roomContains(room, nx, ny)) continue;
          if (!walkable(nx, ny)) continue;
          if (occupied.has(`${nx},${ny}`)) continue; // iteration-order collision (FR-026)
          options.push([nx, ny]);
        }
      }
      if (options.length > 0) {
        const [nx, ny] = state.rng.pick(options);
        occupied.delete(`${enemy.x},${enemy.y}`);
        occupied.add(`${nx},${ny}`);
        enemy.x = nx;
        enemy.y = ny;
      }
    }
  }
}

// Player action: move / bump-attack / descend. Returns the action taken:
// 'blocked' | 'attack' | 'move' | 'descend' | 'victory' | 'none'.
function movePlayer(state, dx, dy) {
  if (state.status !== 'playing') return 'none';
  dx = Math.sign(dx);
  dy = Math.sign(dy);
  if (dx === 0 && dy === 0) return 'none';
  const tx = state.player.x + dx;
  const ty = state.player.y + dy;

  // Wall / boundary: blocked, no position change, no turn consumed (US1-AS4).
  if (!inBounds(tx, ty) || state.tiles[tileIndex(tx, ty)] === TILE_WALL) {
    return 'blocked';
  }

  const target = enemyAt(state, tx, ty);
  if (target) {
    // Bump-to-attack (FR-007): damage the enemy, stay in place.
    const dmg = damage(playerAtk(state), target.def);
    target.hp -= dmg;
    pushLog(state, `You hit ${target.name} for ${dmg}.`);
    if (target.hp <= 0) killEnemy(state, target);
    enemyTurn(state);
    return 'attack';
  }

  state.player.x = tx;
  state.player.y = ty;

  if (state.tiles[tileIndex(tx, ty)] === TILE_STAIRS) {
    // Immediate descent; enemies get no turn this round (FR-011).
    if (state.floor >= MAX_FLOOR) {
      state.status = 'victory';
      pushLog(state, 'You step onto the staircase... and emerge victorious!');
      state.logger.info('game', `victory! floor ${state.floor}, ${state.enemiesDefeated} enemies defeated, seed ${state.seed}`);
      return 'victory';
    }
    enterFloor(state, state.floor + 1);
    pushLog(state, `You descend to floor ${state.floor}.`);
    return 'descend';
  }

  pickUpItem(state);
  activateRoomEnemies(state);
  updateVisibility(state);
  enemyTurn(state);
  updateVisibility(state);
  return 'move';
}

// Inventory use/equip (FR-019, US3): potions consume; weapons/armor swap with
// the equipped slot — the swap always succeeds regardless of occupancy.
function useInventoryItem(state, index) {
  const item = state.player.inventory[index];
  if (!item) return false;
  if (item.kind === 'potion') {
    const before = state.player.hp;
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + item.value);
    state.player.inventory.splice(index, 1);
    pushLog(state, `You drink ${itemLabel(item)} and restore ${state.player.hp - before} HP.`);
    return true;
  }
  const slot = item.kind === 'weapon' ? 'weapon' : 'armor';
  const previous = state.player[slot];
  state.player[slot] = item;
  if (previous) {
    state.player.inventory[index] = previous;
  } else {
    state.player.inventory.splice(index, 1);
  }
  pushLog(state, `You equip ${itemLabel(item)}.`);
  return true;
}

// ===== src/render.js =====
// DOM/CSS character-grid renderer (Rendering Backend clarification, FR-001,
// FR-012, FR-015, FR-032, FR-033, FR-034, FR-035, R102, SC-006).
// Browser-only module: exercised by the US6 integration suite.



function createUI(doc, getGame) {
  const app = doc.getElementById('app');

  // --- header (max 3 lines: stats + log left, controls hint right, FR-033) ---
  const header = doc.createElement('header');
  header.id = 'hud';
  const hudLeft = doc.createElement('div');
  hudLeft.id = 'hud-left';
  const statsEl = doc.createElement('div');
  statsEl.id = 'stats';
  const logEl = doc.createElement('div');
  logEl.id = 'log';
  hudLeft.appendChild(statsEl);
  hudLeft.appendChild(logEl);
  const hudRight = doc.createElement('div');
  hudRight.id = 'hud-right';
  const hintEl = doc.createElement('span');
  hintEl.id = 'hint';
  hintEl.textContent = CONTROL_HINT;
  hudRight.appendChild(hintEl);
  header.appendChild(hudLeft);
  header.appendChild(hudRight);

  // --- scrollable grid viewport, player kept centered (FR-034) ---
  const viewport = doc.createElement('main');
  viewport.id = 'viewport';
  const grid = doc.createElement('div');
  grid.id = 'grid';
  grid.tabIndex = 0; // FR-030: grid container holds browser focus
  viewport.appendChild(grid);

  const cells = new Array(GRID_W * GRID_H);
  const cellCache = new Array(GRID_W * GRID_H).fill('');
  for (let y = 0; y < GRID_H; y++) {
    const row = doc.createElement('div');
    row.className = 'row';
    for (let x = 0; x < GRID_W; x++) {
      const cell = doc.createElement('span');
      cell.className = 'cell c-hidden';
      cell.textContent = ' ';
      cell.dataset.x = x;
      cell.dataset.y = y;
      cells[y * GRID_W + x] = cell;
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }

  // --- full-viewport overlays (FR-035) ---
  function makeOverlay(id) {
    const el = doc.createElement('div');
    el.id = id;
    el.className = 'overlay';
    doc.body.appendChild(el);
    return el;
  }
  app.appendChild(header);
  app.appendChild(viewport);
  const invOverlay = makeOverlay('inventory-overlay');
  const endOverlay = makeOverlay('end-overlay');

  let inventoryOpen = false;
  let selection = 0;

  function cellView(game, x, y) {
    const vis = visibilityAt(game, x, y);
    if (vis === 'hidden') return [' ', 'cell c-hidden']; // black square, layout preserved
    const t = game.tiles[y * GRID_W + x];
    const terrainGlyph = t === TILE_WALL ? '#' : t === TILE_STAIRS ? '>' : '.';
    if (vis === 'dimmed') return [terrainGlyph, 'cell c-dim']; // terrain only (FR-032)
    if (game.player.x === x && game.player.y === y) return ['@', 'cell c-player'];
    const enemy = enemyAt(game, x, y); // alive + in sight radius only (FR-032)
    if (enemy) return [enemy.glyph, 'cell c-enemy'];
    const item = itemAt(game, x, y);
    if (item) return [item.glyph, 'cell c-item'];
    if (t === TILE_STAIRS) return ['>', 'cell c-stairs']; // grey, NOT item blue (2026-07-14)
    return [terrainGlyph, t === TILE_WALL ? 'cell c-wall' : 'cell c-floor'];
  }

  function renderGrid(game) {
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const i = y * GRID_W + x;
        const [glyph, cls] = cellView(game, x, y);
        const key = glyph + '|' + cls;
        if (cellCache[i] === key) continue; // update only changed tiles (FR-029)
        cellCache[i] = key;
        cells[i].textContent = glyph;
        cells[i].className = cls;
      }
    }
  }

  function centerOnPlayer(game) {
    const cell = cells[game.player.y * GRID_W + game.player.x];
    viewport.scrollLeft = cell.offsetLeft - viewport.clientWidth / 2 + cell.offsetWidth / 2;
    viewport.scrollTop = cell.offsetTop - viewport.clientHeight / 2 + cell.offsetHeight / 2;
  }

  function renderHud(game) {
    statsEl.textContent =
      `HP ${game.player.hp}/${game.player.maxHp} · ATK ${playerAtk(game)} · ` +
      `DEF ${playerDef(game)} · LV ${game.floor} · Floor ${game.floor}`;
    logEl.textContent = game.log.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
    hintEl.style.display = game.floor === 1 && game.status === 'playing' ? '' : 'none';
  }

  function renderInventory(game) {
    if (!inventoryOpen) {
      invOverlay.classList.remove('open');
      return;
    }
    invOverlay.classList.add('open');
    const inv = game.player.inventory;
    const lines = ['INVENTORY  (↑/↓ select · Enter use/equip · Esc close)', ''];
    lines.push(`Equipped weapon: ${game.player.weapon ? itemLabel(game.player.weapon) : 'none'}`);
    lines.push(`Equipped armor:  ${game.player.armor ? itemLabel(game.player.armor) : 'none'}`);
    lines.push('');
    for (let i = 0; i < INVENTORY_CAP; i++) {
      const marker = i === selection ? '>' : ' ';
      const label = inv[i] ? itemLabel(inv[i]) : '— empty —';
      lines.push(`${marker} ${String(i + 1).padStart(2)}. ${label}`);
    }
    invOverlay.textContent = lines.join('\n');
  }

  function renderEnd(game) {
    if (game.status === 'playing') {
      endOverlay.classList.remove('open');
      return;
    }
    endOverlay.classList.add('open');
    const title = game.status === 'victory' ? 'VICTORY!' : 'GAME OVER';
    endOverlay.textContent = [
      title,
      '',
      `Floor reached: ${game.floor}`,
      `Enemies defeated: ${game.enemiesDefeated}`,
      `Seed: ${game.seed}`,
      '',
      'Press R to restart',
    ].join('\n');
  }

  function render() {
    const game = getGame();
    renderHud(game);
    renderGrid(game);
    renderInventory(game);
    renderEnd(game);
    centerOnPlayer(game);
  }

  function focusGrid() {
    grid.focus();
  }

  return {
    render,
    focusGrid,
    isInventoryOpen: () => inventoryOpen,
    openInventory() {
      inventoryOpen = true;
      selection = 0;
      render();
    },
    closeInventory() {
      inventoryOpen = false;
      render();
      focusGrid();
    },
    moveSelection(delta) {
      selection = (selection + delta + INVENTORY_CAP) % INVENTORY_CAP;
      render();
    },
    getSelection: () => selection,
    resetCache() {
      cellCache.fill('');
      render();
    },
  };
}

// ===== src/main.js =====
// Browser bootstrap: seed handling (FR-038), keyboard loop (FR-004/FR-027),
// inventory screen (FR-019), restart (FR-008/R101). Browser-only module.





function startGame(win) {
  const doc = win.document;
  const logger = createLogger(win.console);

  function newRun() {
    const seed = parseSeedParam(win.location.search, Date.now);
    return createGame(seed, undefined, logger);
  }

  let game = newRun();
  const ui = createUI(doc, () => game);
  const held = new Set();

  // FR-027: direction keydowns arriving within the same animation frame merge
  // into ONE turn (near-simultaneous cross-axis presses = one diagonal move,
  // enemies respond once). Resolution runs inside requestAnimationFrame —
  // before the frame's paint — so input-to-render latency stays within the
  // 16ms frame budget (SC-005); keyup flushes synchronously, so a completed
  // press never waits even that long.
  const turns = createTurnCoalescer(
    (cb) => win.requestAnimationFrame(cb),
    (key) => {
      if (ui.isInventoryOpen() || game.status !== 'playing') return;
      const move = resolveMove(key, held);
      if (move) {
        movePlayer(game, move[0], move[1]);
        ui.render();
      }
    }
  );

  logger.info('boot', `game booted, seed ${game.seed}`);

  doc.addEventListener('keydown', (e) => {
    const key = normalizeKey(e.key);

    // Inventory screen: pause the game loop while open (FR-019).
    if (ui.isInventoryOpen()) {
      e.preventDefault();
      if (key === 'escape' || key === 'i') {
        ui.closeInventory();
      } else if (key === 'arrowup' || key === 'w') {
        ui.moveSelection(-1);
      } else if (key === 'arrowdown' || key === 's') {
        ui.moveSelection(1);
      } else if (key === 'enter') {
        useInventoryItem(game, ui.getSelection());
        ui.render();
      }
      return;
    }

    // End screens: R restarts from floor 1 (FR-008, R101).
    if (game.status !== 'playing') {
      if (key === 'r') {
        e.preventDefault();
        logger.info('game', 'run restarted');
        game = newRun();
        held.clear();
        turns.cancel();
        ui.resetCache();
        ui.focusGrid();
      }
      return;
    }

    if (key === 'i') {
      e.preventDefault();
      ui.openInventory();
      return;
    }

    if (isDirectionKey(key)) {
      e.preventDefault(); // keep arrows from scrolling the page
      if (!e.repeat) held.add(key);
      turns.press(key); // coalesced: resolves once per frame (FR-027)
    }
  });

  doc.addEventListener('keyup', (e) => {
    const key = normalizeKey(e.key);
    // Resolve any pending turn BEFORE the key leaves the held set, so a fast
    // press-and-release still combines exactly as it was physically held.
    if (isDirectionKey(key)) turns.flush();
    held.delete(key);
  });
  win.addEventListener('blur', () => {
    held.clear();
    turns.cancel();
  });

  ui.render();
  ui.focusGrid();
}

startGame(window);
})();
</script>
